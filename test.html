<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐐𝐔𝐄𝐒𝐓𝐈𝐎𝐍𝐙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cutive+Mono&family=Hind+Siliguri:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* ══════════════════════════════
           TOKENS & BRAND (matched to Onuched Practice Pro)
           ══════════════════════════════ */
        :root {
            --q-font-size: 15px;
            --opt-font-size: 13px;

            /* Brand Original */
            --primary:       #4F46E5;
            --primary-light: #A5B4FC;
            --primary-dim:   rgba(79, 70, 229, 0.10);
            --primary-glow:  rgba(79, 70, 229, 0.22);

            /* Surfaces */
            --bg-page:    #FFFFFF;
            --bg-desktop: #D4D7EE;
            --bg-print:   #4A4B68;

            /* Elevation */
            --shadow-page: 0 2px 6px rgba(0,0,0,0.06), 0 10px 28px rgba(0,0,0,0.08), 0 28px 56px rgba(79,70,229,0.05);
            --shadow-nav: 0 1px 0 rgba(255,255,255,0.9) inset, 0 4px 16px rgba(0,0,0,0.07), 0 8px 40px rgba(79,70,229,0.10);

            /* Motion */
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease:   cubic-bezier(0.16, 1, 0.3, 1);

            /* Semantic accents */
            --emerald-700: #0B3D30;
            --emerald-600: #0F5C46;
            --emerald-wash: rgba(15, 92, 70, 0.13);
            --gold-500: #B8935A;
            --gold-600: #9A7A42;
            --gold: #C9A461;
            --charcoal: #16241F;
            --cream: #F5EFE0;
            --danger: #B5533E;
            --danger-wash: rgba(181, 83, 62, 0.13);
            --violet: #6D28D9;

            --print-margin-top:    8mm;
            --print-margin-right:  6mm;
            --print-margin-bottom: 8mm;
            --print-margin-left:   6mm;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; padding: 0 0 150px 0;
            background-color: var(--bg-desktop);
            font-family: 'Noto Serif Bengali', 'Lora', serif;
            transition: background-color 0.35s var(--ease);
        }

        .recurring { position: relative; display: inline-block; }
        .dot { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 15px; }

        .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.9em; line-height: 1.1; margin: 0 2px; }
        .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
        .frac span:last-child { padding: 0 2px; }
        sup { line-height: 0; font-size: 0.7em; }

        /* ══════════════════════════════
           BOTTOM DOCK (all controls + answer/retake button, unified)
           ══════════════════════════════ */
        .bottom-dock {
            position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
            width: calc(100% - 24px); max-width: 380px; z-index: 3000;
        }
        .dock-inner {
            display: flex; flex-direction: column; gap: 6px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(22px) saturate(190%);
            -webkit-backdrop-filter: blur(22px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 28px;
            padding: 12px 16px 14px;
            box-shadow: var(--shadow-nav);
        }
        .dock-row { display: flex; align-items: center; gap: 8px; }
        .dock-row-top { justify-content: space-between; padding-bottom: 7px; border-bottom: 1px dashed rgba(79, 70, 229, 0.16); }
        .dock-row-bottom { justify-content: center; gap: 10px; }
        .dock-center-space { width: 64px; flex-shrink: 0; }

        .dock-stats { display: flex; align-items: center; gap: 7px; }
        .stat-chip {
            display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 14px;
            background: var(--primary-dim); color: #374151; white-space: nowrap; user-select: none; cursor: pointer;
            font-family: 'Hind Siliguri', sans-serif; font-size: 12.5px; font-weight: 700;
        }
        .stat-chip svg { width: 14px; height: 14px; display: block; }
        .stat-chip .timer-val, .stat-chip .rem-q { font-family: 'Cutive Mono', monospace; font-weight: 700; letter-spacing: 0.2px; }
        .stat-chip.stat-timer { background: var(--danger-wash); color: var(--danger); }

        .dock-icon-btn {
            border: none; width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: transparent; position: relative;
            transition: background 0.2s var(--ease), transform 0.18s var(--spring), box-shadow 0.24s var(--ease), color 0.2s var(--ease);
        }
        .dock-icon-btn svg { width: 19px; height: 19px; display: block; }
        .dock-icon-btn:active { transform: scale(0.86); }
        .dock-icon-btn.save-tone   { color: var(--emerald-600); background: var(--emerald-wash); }
        .dock-icon-btn.save-tone:hover   { background: rgba(15, 92, 70, 0.22); box-shadow: 0 3px 10px rgba(15, 92, 70, 0.28); transform: translateY(-1px); }
        .dock-icon-btn.danger-tone { color: var(--danger); background: var(--danger-wash); }
        .dock-icon-btn.danger-tone:hover { background: rgba(181, 83, 62, 0.22); box-shadow: 0 3px 10px rgba(181, 83, 62, 0.28); transform: translateY(-1px); }
        .dock-icon-btn.gold-tone   { color: var(--gold-600); background: rgba(184, 147, 90, 0.14); }
        .dock-icon-btn.gold-tone:hover   { background: rgba(184, 147, 90, 0.26); box-shadow: 0 3px 10px rgba(184, 147, 90, 0.3); transform: translateY(-1px); }
        .dock-icon-btn.gold-tone.is-active   { background: var(--gold-500); color: #fff; box-shadow: 0 2px 8px rgba(184, 147, 90, 0.45); }
        .dock-icon-btn.violet-tone { color: var(--violet); background: rgba(109, 40, 217, 0.10); }
        .dock-icon-btn.violet-tone:hover { background: rgba(109, 40, 217, 0.20); box-shadow: 0 3px 10px rgba(109, 40, 217, 0.26); transform: translateY(-1px); }
        .dock-icon-btn.violet-tone.is-active { background: var(--violet); color: #fff; box-shadow: 0 2px 8px rgba(109, 40, 217, 0.45); }

        @keyframes btn-spin { to { transform: rotate(360deg); } }
        .btn-spin { animation: btn-spin 0.8s linear infinite; }

        .view-switcher {
            display: flex; gap: 2px; padding: 2px; border-radius: 18px; flex-shrink: 0;
            background: var(--primary-dim); align-items: center; position: relative;
        }
        .view-switcher-indicator {
            position: absolute; top: 2px; left: 2px; height: 26px; border-radius: 14px;
            background: var(--primary); box-shadow: 0 2px 8px var(--primary-glow);
            transition: transform 0.32s var(--spring), width 0.32s var(--spring); z-index: 0;
        }
        .view-btn {
            border: none; padding: 0 9px; height: 26px; border-radius: 14px; flex-shrink: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: transparent; color: #374151; position: relative; z-index: 1;
            transition: color 0.22s var(--ease), transform 0.18s var(--spring);
        }
        .view-btn svg { width: 15px; height: 15px; display: block; }
        .view-btn:not(.active):hover { color: var(--primary); }
        .view-btn:active { transform: scale(0.88); }
        .view-btn.active { color: white; }

        .dock-fab {
            position: absolute; left: 50%; top: -26px; transform: translateX(-50%);
            width: 64px; height: 64px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            border: 4px solid rgba(255,255,255,0.95);
            background: linear-gradient(135deg, #0F5C46 0%, #16966F 100%);
            box-shadow: 0 10px 26px rgba(11,61,48,0.4), 0 3px 10px rgba(11,61,48,0.24), 0 0 0 0 rgba(15,92,70,0.4);
            z-index: 2; animation: fab-pulse 2.8s ease-in-out infinite;
            transition: transform 0.2s var(--spring), box-shadow 0.3s var(--ease), background 0.35s var(--ease);
        }
        .dock-fab.is-reset { background: linear-gradient(135deg, #4F46E5 0%, #7C72F0 100%); animation: fab-pulse-indigo 2.8s ease-in-out infinite; }
        .dock-fab:hover { transform: translateX(-50%) translateY(-2px); }
        .dock-fab:active { transform: translateX(-50%) scale(0.9); }
        .dock-fab svg { width: 28px; height: 28px; fill: white; }
        @keyframes fab-pulse { 0%, 100% { box-shadow: 0 10px 26px rgba(11,61,48,0.4), 0 3px 10px rgba(11,61,48,0.24), 0 0 0 0 rgba(15,92,70,0.4); } 50% { box-shadow: 0 10px 26px rgba(11,61,48,0.4), 0 3px 10px rgba(11,61,48,0.24), 0 0 0 9px rgba(15,92,70,0); } }
        @keyframes fab-pulse-indigo { 0%, 100% { box-shadow: 0 10px 26px rgba(79,70,229,0.4), 0 3px 10px rgba(79,70,229,0.24), 0 0 0 0 rgba(79,70,229,0.4); } 50% { box-shadow: 0 10px 26px rgba(79,70,229,0.4), 0 3px 10px rgba(79,70,229,0.24), 0 0 0 9px rgba(79,70,229,0); } }

        /* ══════════════════════════════
           PAGES & CARDS
           ══════════════════════════════ */
        .page {
            width: 210mm; height: 297mm; padding: 5mm 8mm 15mm 8mm; margin: 10mm auto;
            background: var(--bg-page); box-shadow: var(--shadow-page);
            box-sizing: border-box; position: relative; page-break-after: always; overflow: hidden;
            border-radius: 6px; display: flex; flex-direction: column;
        }

        .content-columns {
            display: flex; flex-direction: column; flex-wrap: wrap; flex: 1 1 auto; min-height: 0;
            column-gap: 10mm; justify-content: flex-start; position: relative;
        }

        body.print-mode .content-columns::after, body.desktop-mode .content-columns::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
            border-left: 1px solid #000; -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }

        .q-card {
            width: calc(50% - 5mm); break-inside: avoid; margin-bottom: 5px; padding: 5px; padding-bottom: 8px;
            border-bottom: 1px dashed rgba(79, 70, 229, 0.18); box-sizing: border-box; border-radius: 4px;
        }

        body.mobile-mode { background: linear-gradient(150deg, #F0F1FF 0%, #EBEEFF 100%); }
        body.mobile-mode .page {
            width: 95%; height: auto; min-height: auto; margin: 16px auto 20px auto; padding: 15px;
            box-shadow: none; overflow: visible; border-top: 3px solid var(--primary); display: block;
        }
        body.mobile-mode .content-columns { display: block; height: auto; column-gap: 0; }
        body.mobile-mode .q-card {
            width: 100%; margin-bottom: 15px; padding: 14px; box-sizing: border-box;
            border: 1px solid rgba(79, 70, 229, 0.10); border-bottom: 1px solid rgba(79, 70, 229, 0.10);
            background: var(--bg-page); border-radius: 10px;
            box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 6px 20px rgba(79,70,229,0.06);
        }

        .header { text-align: center; margin-top: 0; margin-bottom: 8px; border-bottom: 1px solid rgba(79, 70, 229, 0.12); padding-bottom: 4px; }
        .header h2 {
            margin: 0; font-weight: 700; letter-spacing: 0.4px; font-size: 15px; text-transform: uppercase;
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(118deg, var(--primary) 20%, #818CF8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .q-text { font-size: var(--q-font-size); font-weight: bold; display: block; margin-bottom: 5px; color: #1E293B; transition: font-size 0.2s; }
        .option-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .option-btn {
            padding: 3px 8px; background: #F8F9FC; border: 1px solid rgba(79, 70, 229, 0.14);
            border-radius: 6px; cursor: pointer; font-size: var(--opt-font-size); text-align: left; color: #1E293B;
            transition: background 0.18s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease), transform 0.15s var(--spring), box-shadow 0.18s var(--ease);
        }
        .option-btn:hover { background: var(--primary-dim); border-color: var(--primary-light); }
        .option-btn.blur-logic { filter: blur(5px); user-select: none; transition: filter 0.3s ease; }
        .option-btn.selected, .option-btn.opt-correct, .option-btn.opt-wrong, .option-btn.opt-missed { filter: blur(0) !important; }
        .option-btn.selected { background: var(--primary-dim); color: var(--primary); border-color: var(--primary-light); font-weight: bold; }
        .option-btn.opt-correct { background: var(--emerald-wash) !important; color: var(--emerald-700) !important; border-color: var(--emerald-600) !important; font-weight: bold; }
        .option-btn.opt-wrong { background: var(--danger-wash) !important; color: var(--danger) !important; border-color: var(--danger) !important; font-weight: bold; }
        .option-btn.opt-missed { background: rgba(184, 147, 90, 0.16) !important; color: var(--gold-600) !important; border-color: var(--gold-500) !important; font-weight: bold; }
        .locked-card { pointer-events: none; opacity: 0.85; }
        .locked-card .option-btn.opt-correct { background: #E4E6F5 !important; color: #4A4B68 !important; border-color: #B7BBE0 !important; font-weight: bold; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 4000; justify-content: center; align-items: center; }
        .result-modal { background: var(--bg-page); padding: 26px; border-radius: 16px; width: 320px; text-align: center; font-family: 'Noto Serif Bengali', 'Lora', serif; box-shadow: var(--shadow-page); border: 1px solid rgba(79, 70, 229, 0.10); }
        .result-modal h3 { margin-top: 0; font-family: 'Hind Siliguri', sans-serif; font-weight: 700; letter-spacing: 0.3px; background: linear-gradient(118deg, var(--primary) 20%, #818CF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; border-bottom: 1px solid rgba(79, 70, 229, 0.12); padding-bottom: 10px; }
        .result-modal p { font-size: 17px; margin: 10px 0; line-height: 1.6; color: #1E293B; }
        .close-modal-btn { background: var(--primary); color: white; border: none; padding: 9px 26px; border-radius: 999px; cursor: pointer; font-size: 15px; margin-top: 14px; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; box-shadow: 0 4px 14px var(--primary-glow); transition: transform 0.18s var(--spring), box-shadow 0.18s var(--ease); }
        .close-modal-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--primary-glow); }
        .close-modal-btn:active { transform: scale(0.96); }
        .swal2-confirm, .swal2-cancel { font-family: 'Noto Serif Bengali', 'Lora', serif !important; }

        .footer { flex-shrink: 0; display: flex; justify-content: center; text-align: center; font-size: 11px; line-height: 1.2; word-spacing: -1.5px; border-top: 1px solid rgba(15, 23, 42, 0.25); padding-top: 5px; color: #475569; font-family: 'Cutive Mono', 'Hind Siliguri', monospace; font-weight: 300; }
        body.mobile-mode .footer { margin-top: 20px; padding-bottom: 10px; }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(150deg, #F0F1FF 0%, #EBEEFF 100%); display: flex; align-items: center; justify-content: center; z-index: 5000; overflow: hidden; }
        
        /* ===== Octagon Seal Loader — CSS (5s version) ===== */
        .wm-loader {
          position: relative;
          width: 84px;
          height: 84px;
          margin-bottom: 18px;
        }

        .wm-loader-ring {
          width: 100%;
          height: 100%;
          transform: rotate(-90deg);
          overflow: visible;
        }

        .wm-loader-track,
        .wm-loader-draw {
          fill: none;
          stroke-linecap: round;
        }

        .wm-loader-track {
          stroke: rgba(201, 164, 97, 0.16);
          stroke-width: 3;
        }

        .wm-loader-draw {
          stroke: var(--gold);
          stroke-width: 3;
          stroke-dasharray: 100;
          stroke-dashoffset: 100;
          filter: drop-shadow(0 0 4px rgba(201, 164, 97, 0.45));
        }

        /* লুপ মোড — এখন ৫ সেকেন্ডে এক চক্র */
        .wm-loader--loop .wm-loader-draw {
          animation: wm-draw-loop 5s ease-in-out infinite;
        }
        @keyframes wm-draw-loop {
          0%   { stroke-dashoffset: 100; }
          50%  { stroke-dashoffset: 0; }
          100% { stroke-dashoffset: -100; }
        }

        .wm-loader-dot {
          position: absolute;
          inset: 0;
          margin: auto;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--gold);
          animation: wm-pulse 1.4s ease-in-out infinite;
          box-shadow: 0 0 10px rgba(201, 164, 97, 0.7);
        }
        @keyframes wm-pulse {
          0%, 100% { opacity: 0.5; transform: scale(0.85); }
          50%      { opacity: 1;   transform: scale(1.15); }
        }

        @media (prefers-reduced-motion: reduce) {
          .wm-loader-draw { animation: none; stroke-dashoffset: 0; }
          .wm-loader-dot  { animation: none; }
        }

        /* --- গ্র্যান্ড হেডার --- */
        .grand-header { position: relative; display: none; text-align: center; border-bottom: 1.5px solid #0F172A; padding-bottom: 8px; margin-bottom: 10px; }
        .grand-header h1 { margin: 0; font-size: 36px; font-weight: 900; letter-spacing: 5px; font-family: 'Cinzel', serif; color: #0F172A; }
        .grand-header h3 {
            margin: 6px auto;
            max-width: calc(100% - 170px);
            font-size: 11px;
            font-family: 'Cutive Mono', 'Hind Siliguri', monospace;
            font-weight: 500;
            color: #000;
            letter-spacing: -0.3px;
            word-spacing: -2px;
            line-height: 1.15;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .grand-header .meta { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-top: 5px; font-family: 'Noto Serif Bengali', serif; color: #334155; }
        .qr-code-print { position: absolute; top: 0; right: 0; width: 75px; height: 75px; border-radius: 4px; border: 2px solid #0F172A; padding: 2px; background: #FFFFFF; box-sizing: border-box; }
        .katex { font-size: 1.1em; }

        /* --- Print Mode Styles --- */
        body.print-mode { background-color: var(--bg-print); }
        body.print-mode .page, body.desktop-mode .page { width: 210mm; height: 297mm; padding: var(--print-margin-top) var(--print-margin-right) var(--print-margin-bottom) var(--print-margin-left); margin: 20px auto; background: var(--bg-page); box-shadow: 0 8px 30px rgba(0,0,0,0.35); border: none; border-radius: 4px; }
        body.print-mode .grand-header, body.desktop-mode .grand-header { display: block; }
        body.print-mode .page-header, body.desktop-mode .page-header { display: none; }
        body.print-mode .q-card, body.desktop-mode .q-card { width: calc(50% - 5mm); border: none; margin-bottom: 0px; padding: 2px 5px; }
        body.print-mode .q-card { pointer-events: none !important; opacity: 1 !important; }
        body.print-mode .q-text, body.desktop-mode .q-text { line-height: 1.1; margin-bottom: 2px; }
        body.print-mode .option-container, body.desktop-mode .option-container { gap: 2px; }
        body.print-mode .option-btn, body.desktop-mode .option-btn, body.print-mode .option-btn.selected, body.print-mode .option-btn.opt-correct, body.print-mode .option-btn.opt-wrong, body.print-mode .option-btn.opt-missed, body.print-mode .locked-card .option-btn.opt-correct { background: transparent !important; border: 1px solid transparent !important; padding: 1px 4px; color: #000 !important; font-weight: normal !important; line-height: 1.1; }

        body.desktop-mode .option-btn.selected { background: var(--primary-dim) !important; color: var(--primary) !important; border-color: var(--primary-light) !important; font-weight: bold !important; }
        body.desktop-mode .option-btn.opt-correct { background: var(--emerald-wash) !important; color: var(--emerald-700) !important; border-color: var(--emerald-600) !important; font-weight: bold !important; }
        body.desktop-mode .option-btn.opt-wrong { background: var(--danger-wash) !important; color: var(--danger) !important; border-color: var(--danger) !important; font-weight: bold !important; }
        body.desktop-mode .option-btn.opt-missed { background: rgba(184, 147, 90, 0.16) !important; color: var(--gold-600) !important; border-color: var(--gold-500) !important; font-weight: bold !important; }
        body.desktop-mode .locked-card .option-btn.opt-correct { background: #E4E6F5 !important; color: #4A4B68 !important; border-color: #B7BBE0 !important; font-weight: bold !important; }

        body.print-mode .footer, body.desktop-mode .footer { border-top: none; }

        @media print {
            @page { size: A4; margin: 0; }
            .bottom-dock, #loading-screen, .modal-overlay { display: none !important; }
            body { background: none !important; margin: 0 !important; padding: 0 !important; }
            .page { box-shadow: none !important; margin: 0 !important; padding: var(--print-margin-top) var(--print-margin-right) var(--print-margin-bottom) var(--print-margin-left) !important; width: 210mm !important; height: 297mm !important; page-break-after: always; box-sizing: border-box; }
            .page:last-child { page-break-after: auto; }
            .grand-header { display: block !important; }
            .page-header { display: none !important; }
            .q-card { border: none !important; margin-bottom: 0 !important; pointer-events: none !important; opacity: 1 !important; }
            .q-text { line-height: 1.1 !important; margin-bottom: 2px !important; }
            .option-container { gap: 2px !important; }

    <script type="module"> 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // ফায়ারবেস কনফিগ (লগিন ছাড়াই ডেটাবেস থেকে প্রশ্ন নেওয়ার জন্য)
        const firebaseConfig={apiKey:"AIzaSyCcS1zWFslmbRFS5PAvNrH8TFYIbR8N7ic",authDomain:"questionz-me.firebaseapp.com",projectId:"questionz-me",storageBucket:"questionz-me.firebasestorage.app",messagingSenderId:"393630463399",appId:"1:393630463399:web:825468121216445828f282",databaseURL:"https://questionz-me-default-rtdb.asia-southeast1.firebasedatabase.app/"};
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let mcqData = []; 
        let userAnswers = {}; 
        let lockedIds = new Set(); 
        let totalQuestionsCount = 0; 
        let timerInterval = null; 
        let isShuffled = false; 
        let displaySetName = ""; 
        let displayCatName = ""; 

        const ICON_EYE      = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3"/></svg>';
        const ICON_EYE_OFF  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="4" x2="20" y2="20"/></svg>';
        const ICON_SPINNER  = '<svg class="btn-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
        const ICON_PLAY     = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        const ICON_REFRESH  = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 2.6 6.36"/><polyline points="3,17 3,21 7,21"/></svg>';

        function updateViewIndicator() {
            const activeBtn = document.querySelector('.view-btn.active');
            const indicator = document.getElementById('view-switcher-indicator');
            if (activeBtn && indicator) {
                indicator.style.width = activeBtn.offsetWidth + 'px';
                indicator.style.transform = `translateX(${activeBtn.offsetLeft - 2}px)`;
            }
        }
        
        const urlParams = new URLSearchParams(window.location.search); 
        const parentID = urlParams.get('parent'); 
        const catID = urlParams.get('cat'); 
        const setID = urlParams.get('set'); 
        
        // প্রগ্রেস ব্রাউজারে সেভ করার জন্য লোকাল স্টোরেজ কি (Local Storage Key)
        const getLocalProgressKey = () => `qz_prog_${parentID}_${catID}_${setID}`; 
        const tempStorageKey = () => `temp_ans_${parentID}_${catID}_${setID}`; 
        
        let currentQFontSize = 15; 
        let currentOptFontSize = 13;

        const fR = (text) => {
            if (!text) return "";
            return text.toString().replace(/([০-৯0-9])\u0307/g, '<span class="recurring">$1<span class="dot">.</span></span>');
        };

        window.increaseFontSize = function() { 
            currentQFontSize += 1; currentOptFontSize += 1; 
            document.documentElement.style.setProperty('--q-font-size', currentQFontSize + 'px'); 
            document.documentElement.style.setProperty('--opt-font-size', currentOptFontSize + 'px'); 
            if(mcqData.length > 0) setTimeout(() => paginate(), 10);
        }; 
        
        window.decreaseFontSize = function() { 
            if (currentQFontSize > 10) { 
                currentQFontSize -= 1; currentOptFontSize -= 1; 
                document.documentElement.style.setProperty('--q-font-size', currentQFontSize + 'px'); 
                document.documentElement.style.setProperty('--opt-font-size', currentOptFontSize + 'px'); 
                if(mcqData.length > 0) setTimeout(() => paginate(), 10);
            } 
        }; 
        
        window.toggleView = function(view) { 
            document.body.classList.remove('mobile-mode', 'desktop-mode', 'print-mode'); 
            document.getElementById('mobile-view-btn').classList.remove('active'); 
            document.getElementById('desktop-view-btn').classList.remove('active'); 
            document.getElementById('print-view-btn').classList.remove('active'); 

            if (view === 'mobile') { 
                document.body.classList.add('mobile-mode'); 
                document.getElementById('mobile-view-btn').classList.add('active'); 
            } else if (view === 'desktop') { 
                document.body.classList.add('desktop-mode'); 
                document.getElementById('desktop-view-btn').classList.add('active'); 
            } else if (view === 'print') {
                document.body.classList.add('print-mode'); 
                document.getElementById('print-view-btn').classList.add('active'); 
            }
            if(mcqData.length > 0) setTimeout(() => paginate(), 10);
            updateViewIndicator();
        }; 

        async function fetchMCQs() { 
            if (!parentID || !catID || !setID) { 
                document.getElementById("loading-screen").innerHTML = "<div style='color:#666; font-size:18px;'>ডেটা পাওয়া যায়নি!</div>"; 
                return; 
            } 
            try { 
                try {
                    const catDocRef = doc(db, "categories", catID);
                    const catSnap = await getDoc(catDocRef);
                    displayCatName = (catSnap.exists() && catSnap.data().name) ? catSnap.data().name : catID;
                } catch(e) { displayCatName = catID; }

                const docRef = doc(db, parentID, catID, "sets", setID); 
                const docSnap = await getDoc(docRef); 
                
                if (docSnap.exists()) { 
                    const data = docSnap.data(); 
                    displaySetName = data.title ? data.title : setID; 
                    if (displaySetName === setID) {
                        try {
                            const metaRef = doc(db, parentID, catID, "sets", "_metadata");
                            const metaSnap = await getDoc(metaRef);
                            if (metaSnap.exists() && metaSnap.data()[setID] && metaSnap.data()[setID].title) {
                                displaySetName = metaSnap.data()[setID].title;
                            }
                        } catch(err) { console.log("Metadata fetch error:", err); }
                    }

                    document.title = displayCatName + " - " + displaySetName + " | 𝐐𝐔𝐄𝐒𝐓𝐈𝐎𝐍𝐙 ";

                    const rawQuestions = data.questions; 
                    mcqData = rawQuestions.map((q, index) => { 
                        let correctKey = q.ans; 
                        if (q.ans && !['a','b','c','d'].includes(q.ans)) { 
                            const idx = q.options.indexOf(q.ans); 
                            if (idx !== -1) correctKey = ['a','b','c','d'][idx]; 
                        } 
                        return { id: index + 1, q: q.question, a: q.options[0], b: q.options[1], c: q.options[2], d: q.options[3], ans: correctKey, orig_a: q.options[0], orig_b: q.options[1], orig_c: q.options[2], orig_d: q.options[3], orig_ans: correctKey }; 
                    }); 
                    totalQuestionsCount = mcqData.length; 
                    
                    // ব্রাউজারের লোকাল স্টোরেজ থেকে লক করা আইডিগুলো আনা হচ্ছে
                    const savedProgress = localStorage.getItem(getLocalProgressKey());
                    if (savedProgress) { lockedIds = new Set(JSON.parse(savedProgress)); } 
                    initApp(); 
                } 
            } catch (error) { document.getElementById("loading-screen").innerHTML = "<div style='color:#d93025; font-size:18px;'>এরর: " + error.message + "</div>"; } 
        } 

        function initApp() { 
            document.getElementById("loading-screen").style.display = "none"; 
            const savedTemp = localStorage.getItem(tempStorageKey()); 
            if (savedTemp) { userAnswers = JSON.parse(savedTemp); } 
            let activeQ = mcqData.filter(q => !lockedIds.has(q.id)); 
            let lockedQ = mcqData.filter(q => lockedIds.has(q.id)); 
            mcqData = [...activeQ, ...lockedQ]; 
            
            paginate(); 
            document.fonts.ready.then(() => {
                if(mcqData.length > 0) paginate();
            });

            startTimer(activeQ.length); 
        } 
        
        window.saveProgress = async function() { 
            const saveBtn = document.getElementById('cloud-save-btn'); 
            const originalText = saveBtn.innerHTML; 
            saveBtn.innerHTML = ICON_SPINNER; 
            Object.keys(userAnswers).forEach(id => { 
                const qId = Number(id); 
                const questionItem = mcqData.find(q => q.id === qId); 
                if (questionItem && userAnswers[id] === questionItem[questionItem.ans]) { 
                    lockedIds.add(qId); 
                } 
            }); 
            try { 
                // ক্লাউডের বদলে লোকাল স্টোরেজে সেভ করা হচ্ছে
                localStorage.setItem(getLocalProgressKey(), JSON.stringify(Array.from(lockedIds))); 
                localStorage.removeItem(tempStorageKey()); 
                Swal.fire({ icon: 'success', title: 'সেভ সফল!', text: 'আপনার প্রগ্রেস এই ব্রাউজারে সেভ হয়েছে। শুধুমাত্র সঠিক উত্তরগুলো লক করা হয়েছে।', timer: 2000, showConfirmButton: false }); 
                userAnswers = {}; 
                paginate(); 
            } catch (e) { 
                Swal.fire('Error', 'সেভ করা সম্ভব হয়নি!', 'error'); 
            } finally { 
                saveBtn.innerHTML = originalText; 
            } 
        }; 
        
        window.unlockAllProgress = async function() { 
            const result = await Swal.fire({ title: 'সব প্রশ্ন আনলক করবেন?', text: "আপনার সংরক্ষিত সব প্রগ্রেস মুছে যাবে এবং প্রশ্নগুলো আবার পরীক্ষা দেওয়ার জন্য খুলে যাবে!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#B5533E', cancelButtonColor: '#4F46E5', confirmButtonText: 'হ্যাঁ, আনলক করুন!', cancelButtonText: 'বাতিল' }); 
            if (result.isConfirmed) { 
                lockedIds.clear(); 
                userAnswers = {}; 
                localStorage.removeItem(tempStorageKey()); 
                localStorage.removeItem(getLocalProgressKey()); 
                try { 
                    Swal.fire('সফল!', 'সব প্রশ্ন আনলক করা হয়েছে।', 'success'); 
                    initApp(); 
                } catch (e) { 
                    Swal.fire('Error', 'আনলক করা সম্ভব হয়নি!', 'error'); 
                } 
            } 
        }; 
        
        window.toggleAllBlur = function() { const btn = document.getElementById('blur-toggle-btn'); const options = document.querySelectorAll('.option-btn'); if (btn.classList.contains('is-active')) { options.forEach(opt => opt.classList.remove('blur-logic')); btn.classList.remove('is-active'); btn.innerHTML = ICON_EYE; } else { options.forEach(opt => { const card = opt.closest('.q-card'); if (!opt.classList.contains('selected') && !opt.classList.contains('opt-correct') && !(card && card.classList.contains('locked-card'))) { opt.classList.add('blur-logic'); } }); btn.classList.add('is-active'); btn.innerHTML = ICON_EYE_OFF; } }; 
        
        window.toggleShuffle = function() { 
            const btn = document.getElementById('shuffle-toggle-btn'); 
            let activeQ = mcqData.filter(q => !lockedIds.has(q.id)); 
            let lockedQ = mcqData.filter(q => lockedIds.has(q.id)); 
            const isPrintOrAllLocked = document.body.classList.contains('print-mode') || (lockedIds.size > 0 && lockedIds.size === totalQuestionsCount);
            
            if (isShuffled) { 
                activeQ.sort((a, b) => a.id - b.id); 
                lockedQ.sort((a, b) => a.id - b.id); 
                mcqData.forEach(q => { 
                    q.a = q.orig_a; q.b = q.orig_b; q.c = q.orig_c; q.d = q.orig_d; q.ans = q.orig_ans; 
                }); 
                isShuffled = false; 
                btn.classList.remove('is-active'); 
            } else { 
                shuffle(activeQ); 
                if (isPrintOrAllLocked) { shuffle(lockedQ); }
                const targetQs = isPrintOrAllLocked ? [...activeQ, ...lockedQ] : activeQ;
                targetQs.forEach(q => { 
                    let opts = [q.a, q.b, q.c, q.d]; 
                    let correctVal = q[q.ans]; 
                    shuffle(opts); 
                    q.a = opts[0]; q.b = opts[1]; q.c = opts[2]; q.d = opts[3]; 
                    q.ans = correctVal === q.a ? 'a' : correctVal === q.b ? 'b' : correctVal === q.c ? 'c' : 'd'; 
                }); 
                isShuffled = true; 
                btn.classList.add('is-active'); 
            } 
            mcqData = [...activeQ, ...lockedQ]; 
            paginate(); 
            const blurBtn = document.getElementById('blur-toggle-btn'); 
            if (blurBtn && !blurBtn.classList.contains('is-active')) { 
                const options = document.querySelectorAll('.option-btn'); 
                options.forEach(opt => opt.classList.remove('blur-logic')); 
            } 
        }; 
        
        function toBengaliNumber(n) { const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯']; return n.toString().split('').map(digit => bengaliDigits[digit] || digit).join(''); } 
        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } } 

        function paginate() { 
            document.querySelectorAll('.page').forEach(p => p.remove()); 
            let currentPageNum = 1; 
            let currentPage = createNewPage(currentPageNum); 
            let currentColumnContainer = currentPage.querySelector('.content-columns'); 
            const isMobile = document.body.classList.contains('mobile-mode');
            const isPrint = document.body.classList.contains('print-mode');

            for (let i = 0; i < mcqData.length; i++) { 
                const item = mcqData[i]; 
                const card = document.createElement('div'); 
                card.className = 'q-card'; 
                
                const isLocked = isPrint ? false : lockedIds.has(item.id);
                if (isLocked) card.classList.add('locked-card'); 
                card.id = `q-card-display-${i}`; 
                
                const savedText = isPrint ? null : userAnswers[item.id]; 
                const isSelected = (optKey) => savedText && item[optKey] === savedText ? 'selected' : ''; 
                const isLockedCorrect = (opt) => (isLocked && item.ans === opt) ? 'opt-correct' : ''; 
                const isBlurred = (optKey) => { 
                    const bBtn = document.getElementById('blur-toggle-btn'); 
                    if(bBtn && !bBtn.classList.contains('is-active')) return ''; 
                    return (savedText && item[optKey] === savedText) || isLocked ? '' : 'blur-logic'; 
                }; 
                
                card.innerHTML = ` <span class="q-text">${toBengaliNumber(i + 1)}. ${fR(item.q)}</span><div class="option-container"><div class="option-btn ${isLockedCorrect('a')} ${isSelected('a')} ${isBlurred('a')}" onclick="markAnswered(this, ${i}, 'a')">ক) ${fR(item.a)}</div><div class="option-btn ${isLockedCorrect('b')} ${isSelected('b')} ${isBlurred('b')}" onclick="markAnswered(this, ${i}, 'b')">খ) ${fR(item.b)}</div><div class="option-btn ${isLockedCorrect('c')} ${isSelected('c')} ${isBlurred('c')}" onclick="markAnswered(this, ${i}, 'c')">গ) ${fR(item.c)}</div><div class="option-btn ${isLockedCorrect('d')} ${isSelected('d')} ${isBlurred('d')}" onclick="markAnswered(this, ${i}, 'd')">ঘ) ${fR(item.d)}</div></div> `; 
                
                currentColumnContainer.appendChild(card); 

                if (!isMobile) {
                    if (currentColumnContainer.scrollWidth > currentColumnContainer.clientWidth + 5) { 
                        currentColumnContainer.removeChild(card); 
                        currentPageNum++; 
                        currentPage = createNewPage(currentPageNum); 
                        currentColumnContainer = currentPage.querySelector('.content-columns'); 
                        currentColumnContainer.appendChild(card); 
                    } 
                }
            } 
            updateFooterStats(); 
            
            if (window.renderMathInElement) {
                document.querySelectorAll('.q-card').forEach(card => {
                    renderMathInElement(card, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                });
            }
        } 

        function createNewPage(num) { 
            const page = document.createElement('div'); 
            page.className = 'page'; 
            
            let pathText = localStorage.getItem('qz_current_path') || 'QUESTIONZ';

            let grandHeaderHTML = '';
            let colClass = 'content-columns';
            
            if (num === 1) {
                colClass = 'content-columns first-page-columns';
                const qrText = window.location.href;
                const qrDataEncoded = encodeURIComponent(qrText);

                grandHeaderHTML = `
                <div class="grand-header">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qrDataEncoded}" class="qr-code-print" alt="QR Code">
                    <h1>QUESTIONZ</h1>
                    <h3>${pathText}</h3>
                    <div class="meta">
                        <span>সময়: ${toBengaliNumber(totalQuestionsCount)} মিনিট</span>
                        <span>পূর্ণমান: ${toBengaliNumber(totalQuestionsCount)}</span>
                    </div>
                </div>`;
            }

            page.innerHTML = ` 
                ${grandHeaderHTML}
                <div class="header page-header"><h2>পেইজ - ${toBengaliNumber(num)}</h2></div>
                <div class="${colClass}"></div>
                <div class="footer"></div> 
            `; 
            document.body.appendChild(page); 
            return page; 
        } 

        window.markAnswered = function(btn, displayIdx, selectedOpt) { const item = mcqData[displayIdx]; if (lockedIds.has(item.id)) return; if (btn.classList.contains('blur-logic')) { btn.classList.remove('blur-logic'); return; } const parent = btn.parentElement; parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); userAnswers[item.id] = item[selectedOpt]; localStorage.setItem(tempStorageKey(), JSON.stringify(userAnswers)); updateFooterStats(); }; 
        function updateFooterStats() { const answeredCount = Object.keys(userAnswers).length + lockedIds.size; const remaining = totalQuestionsCount - answeredCount; document.querySelectorAll('.rem-q').forEach(el => { el.innerText = toBengaliNumber(Math.max(0, remaining)); }); } 
        
        window.showFinalResult = async function() { 
            let roundCorrectCount = 0; let wrongCount = 0; 
            const letterToIndex = { 'a': 0, 'b': 1, 'c': 2, 'd': 3 }; 
            mcqData.forEach((item, i) => { 
                const card = document.getElementById(`q-card-display-${i}`); 
                if(!card) return; 
                const options = card.querySelectorAll('.option-btn'); 
                const correctLetter = item.ans; 
                const correctText = item[correctLetter]; 
                const userSelectedText = userAnswers[item.id]; 
                if (lockedIds.has(item.id)) return; 
                if (userSelectedText) { 
                    if (userSelectedText === correctText) { 
                        options[letterToIndex[correctLetter]].classList.add('opt-correct'); 
                        lockedIds.add(item.id); 
                        roundCorrectCount++; 
                    } else { 
                        wrongCount++; 
                        const wrongLetter = ['a','b','c','d'].find(k => item[k] === userSelectedText); 
                        if(wrongLetter) options[letterToIndex[wrongLetter]].classList.add('opt-wrong'); 
                        options[letterToIndex[correctLetter]].classList.add('opt-correct'); 
                    } 
                } 
            }); 
            localStorage.removeItem(tempStorageKey()); 
            
            // রেজাল্ট দেখার পর অটো সেভ 
            if (lockedIds.size > 0) { 
                localStorage.setItem(getLocalProgressKey(), JSON.stringify(Array.from(lockedIds))); 
            } 
            
            let totalCorrect = lockedIds.size; 
            let finalScore = totalCorrect - (wrongCount * 0.25); 
            const btn = document.getElementById('action-btn'); 
            btn.onclick = resetExam; btn.classList.add('is-reset'); 
            btn.innerHTML = ICON_REFRESH; 
            document.getElementById('result-content').innerHTML = ` <p>এই রাউন্ডে সঠিক: ${toBengaliNumber(roundCorrectCount)} টি</p><p>সঠিক (মোট): ${toBengaliNumber(totalCorrect)} টি</p><p>ভুল (এই রাউন্ড): ${toBengaliNumber(wrongCount)} টি</p><p style="font-weight:bold; color:#B5533E;">মোট নম্বর: ${toBengaliNumber(finalScore.toFixed(2))}</p> `; 
            document.getElementById('result-overlay').style.display = 'flex'; 
        }; 
        
        window.closeModal = function() { document.getElementById('result-overlay').style.display = 'none'; }; 
        window.resetExam = async function() { if (lockedIds.size === totalQuestionsCount) { Swal.fire({ icon: 'info', title: 'সবগুলো সঠিক হয়েছে!', text: 'পুনরায় পরীক্ষা দেওয়ার জন্য দয়া করে আগে সবগুলো প্রশ্ন আনলক করুন।', confirmButtonText: 'ঠিক আছে' }); return; } userAnswers = {}; localStorage.removeItem(tempStorageKey()); initApp(); const btn = document.getElementById('action-btn'); btn.onclick = showFinalResult; btn.classList.remove('is-reset'); btn.innerHTML = ICON_PLAY; }; 
        function startTimer(mins) { if (timerInterval) clearInterval(timerInterval); let time = mins * 60; timerInterval = setInterval(() => { let m = Math.floor(time / 60); let s = time % 60; let display = `${toBengaliNumber(m.toString().padStart(2, '0'))}:${toBengaliNumber(s.toString().padStart(2, '0'))}`; document.querySelectorAll('.timer-val').forEach(el => el.innerText = display); if (time > 0) time--; else { clearInterval(timerInterval); timerInterval = null; } }, 1000); }

        updateViewIndicator();
        
        // পেজ লোড হলেই প্রশ্ন ফেচ শুরু হবে
        fetchMCQs();
    </script>
</body>
</html>
