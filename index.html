<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Questionz — লগইন</title>
<meta name="theme-color" content="#0B100E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Serif+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal-950: #0B100E;
    --charcoal-900: #121A15;
    --charcoal-800: #1B251E;
    --charcoal-800-hover: #223028;
    --charcoal-border: rgba(201,164,97,0.14);
    --cream: #F4EFE3;
    --cream-dim: #B9B2A0;
    --emerald-glow: rgba(53,168,131,0.20);
    --gold: #C9A461;
    --danger: #E17A63;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--charcoal-950); color: var(--cream); }
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 24px; font-family: 'Noto Serif Bengali', serif; }
  
  .glow { position: absolute; width: 640px; height: 640px; max-width: 140vw; border-radius: 50%; background: radial-gradient(circle, var(--emerald-glow) 0%, rgba(53,168,131,0.06) 45%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -55%); filter: blur(10px); animation: drift 14s ease-in-out infinite; pointer-events: none; }
  @keyframes drift { 0%, 100% { transform: translate(-52%, -57%) scale(1); } 50% { transform: translate(-48%, -53%) scale(1.08); } }
  
  .card { position: relative; z-index: 1; width: 100%; max-width: 380px; background: linear-gradient(180deg, rgba(27,37,30,0.90), rgba(18,26,21,0.94)); border: 1px solid var(--charcoal-border); border-radius: 20px; padding: 40px 32px 32px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset; text-align: center; }
  .wordmark { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em; color: var(--cream); margin: 0; }
  .wordmark span { color: var(--gold); }
  .divider { width: 40px; height: 2px; margin: 18px auto 20px; background: linear-gradient(90deg, transparent, var(--gold), transparent); border: none; }
  .tagline { font-size: 15px; color: var(--cream-dim); margin: 0 0 32px; line-height: 1.7; }
  
  .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 20px; background: var(--charcoal-800); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; color: var(--cream); font-family: 'Noto Serif Bengali', serif; font-size: 15.5px; font-weight: 500; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
  .google-btn:hover:not(:disabled) { background: var(--charcoal-800-hover); border-color: rgba(201,164,97,0.35); }
  .google-btn:active:not(:disabled) { transform: scale(0.98); }
  .google-btn:disabled { opacity: 0.65; cursor: default; }
  .google-icon { width: 20px; height: 20px; flex-shrink: 0; background: #fff; border-radius: 50%; padding: 2px; }
  
  .spinner { width: 18px; height: 18px; flex-shrink: 0; border: 2px solid rgba(244,239,227,0.25); border-top-color: var(--cream); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-box { margin-top: 18px; padding: 12px 14px; background: rgba(225,122,99,0.12); border: 1px solid rgba(225,122,99,0.35); border-radius: 10px; color: var(--danger); font-size: 14px; line-height: 1.6; display: none; }
  .error-box.visible { display: block; }
  .footnote { margin-top: 28px; font-size: 12.5px; color: var(--cream-dim); opacity: 0.7; line-height: 1.6; }
  .status-text { margin-top: 14px; font-size: 12px; color: var(--gold); opacity: 0.85; line-height: 1.6; min-height: 1.6em; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">
    <h1 class="wordmark">QUESTION<span>Z</span></h1>
    <hr class="divider" />
    <p class="tagline">পরীক্ষার প্রস্তুতি,<br />এক জায়গায়</p>

    <button id="googleSignInBtn" class="google-btn" type="button">
      <svg id="googleIcon" class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.2 0-9.7-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.6 5.4C41.4 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      <span id="spinner" class="spinner" hidden></span>
      <span id="btnText" class="btn-text">Google দিয়ে চালিয়ে যান</span>
    </button>

    <div id="errorBox" class="error-box" role="alert"></div>
    <p id="statusText" class="status-text" aria-live="polite"></p>

    <p class="footnote">চালিয়ে যাওয়ার মাধ্যমে আপনি Questionz-এর ব্যবহারবিধিতে সম্মত হচ্ছেন</p>
  </main>

  <script>
    // বাটন ক্লিক করলে যেন পেজ লোড না নেয় বা কোথাও রিডাইরেক্ট না হয়, 
    // তার জন্য শুধুমাত্র ডিফল্ট ইভেন্ট বন্ধ রাখা হয়েছে।
    const btn = document.getElementById("googleSignInBtn");

    btn.addEventListener("click", (e) => {
      e.preventDefault(); 
      // এখানে কোনো প্রসেসিং হবে না, শুধু ডিজাইনটি দেখার জন্য এভাবেই রাখা হলো।
    });
  </script>
</body>
</html>
