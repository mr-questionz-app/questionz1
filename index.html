    <style>
        /* ========================================================
           GLOBAL APP STRUCTURE
           ======================================================== */
        body { margin: 0; padding: 0; transition: background-color 0.35s cubic-bezier(0.16, 1, 0.3, 1); overflow-x: hidden; }
        .app-view { display: none; width: 100%; min-height: 100vh; position: relative; }
        .app-view.active-view { display: block; }
        #dashboard-view.active-view { display: flex; flex-direction: column; align-items: center; }

        /* ========================================================
           DASHBOARD CSS (Unchanged, prefixed to avoid conflicts)
           ======================================================== */
        #dashboard-view {
            --primary-color:#1B251E; --secondary-color:#C9A461; --bg-color:#0B100E; --card-bg:#1B251E; --text-color:#F4EFE3; --gold-accent:#C9A461; --gold-gradient:linear-gradient(135deg, #C9A461, #fcf6ba); --charcoal-800-hover:#223028; --charcoal-border:rgba(201,164,97,0.14); --cream-dim:#B9B2A0;
            font-family:'Cuprum',sans-serif; font-weight:400; background:var(--bg-color); color:var(--text-color);
        }
        #dashboard-view nav { width:100%; padding:5px 5%; display:flex; justify-content:space-between; align-items:center; background:rgba(18,26,21,0.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:1000; border-bottom:1px solid var(--charcoal-border); box-sizing:border-box; }
        #dashboard-view .logo-wrapper { display:flex; align-items:center; gap:12px; }
        #dashboard-view .logo-text { font-family:'Cuprum',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.5px; background:var(--gold-gradient); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 5px rgba(201,164,97,0.5)); width:26px; height:26px; border:1px solid rgba(201,164,97,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 8px rgba(201,164,97,0.2); flex-shrink:0; }
        #dashboard-view header { text-align:left; width:90%; max-width:900px; margin-top:10px; margin-bottom:5px; }
        #dashboard-view .breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px; }
        #dashboard-view .breadcrumb-item { background:var(--card-bg); border:1px solid var(--charcoal-border); padding:2px 7px; border-radius:4px; font-family:'Cuprum','Hoogly','Bensen',sans-serif; font-size:11px; font-weight:400; color:var(--gold-accent); cursor:pointer; transition:0.3s; display:flex; align-items:center; justify-content:center; user-select:none; }
        #dashboard-view .breadcrumb-item:hover { background:var(--charcoal-800-hover); border-color:var(--gold-accent); transform:translateY(-1px); }
        #dashboard-view .separator { color:var(--cream-dim); font-size:9px; font-weight:normal; }
        #dashboard-view .wave-text { font-family:'Cuprum',sans-serif; font-size:1.1rem; font-weight:400; margin:0; padding:0; text-transform:uppercase; color:var(--text-color); display:inline-block; line-height:1; letter-spacing:0.15rem; filter:drop-shadow(0 0 8px rgba(0,0,0,0.3)); }
        #dashboard-view .divider { width:90%; max-width:900px; height:1px; background:linear-gradient(to right,rgba(201,164,97,0),rgba(201,164,97,0.2),rgba(201,164,97,0)); margin:15px 0 5px 0; }
        #dashboard-view .noun-section-wrapper { padding:10px 0; width:280px; max-width:95%; box-sizing:border-box; margin-top:5px; }
        #dashboard-view .grid-container { display:grid; grid-template-columns:1fr; gap:12px; }
        #dashboard-view .noun-box { position:relative; height:42px; padding:0 15px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(180deg, rgba(27,37,30,0.7), rgba(18,26,21,0.9)); overflow:hidden; border-radius:6px; text-decoration:none; border:1px solid var(--charcoal-border); cursor:pointer; box-sizing:border-box; user-select:none; }
        #dashboard-view .noun-box span { position:relative; z-index:2; font-family:'Cuprum','Hoogly','Bensen',sans-serif; font-size:15px; font-weight:400; color:var(--text-color); white-space:nowrap; pointer-events:none; }
        #dashboard-view .progress-percent { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; color: var(--text-color); background: rgba(201,164,97,0.15); padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(201,164,97,0.25); box-shadow: inset 0 0 8px rgba(201,164,97,0.05), 0 2px 5px rgba(0, 0, 0, 0.3); backdrop-filter: blur(5px); display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; transition: all 0.3s ease; }
        #dashboard-view .progress-percent::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--gold-accent); border-radius: 50%; box-shadow: 0 0 6px var(--gold-accent), 0 0 10px var(--gold-accent); animation: pulse-dot 2s infinite ease-in-out; }
        @keyframes pulse-dot { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--gold-accent), 0 0 18px var(--gold-accent); } 100% { transform: scale(0.9); opacity: 0.7; } }
        #dashboard-view .progress-bar-bg { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(244,239,227,0.05); width: 100%; z-index: 1; border-radius: 0 0 6px 6px; overflow: hidden; }
        #dashboard-view .progress-bar-fill { height: 100%; background: linear-gradient(90deg, rgba(53,168,131,0.6), var(--gold-accent)); box-shadow: 0 -1px 8px rgba(201,164,97,0.5); border-radius: 0 4px 4px 0; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        #dashboard-view .noun-box:hover { background:var(--charcoal-800-hover); border-color:var(--gold-accent); transform:translateY(-2px); transition:all .3s ease; }
        #dashboard-view #dash-loading { display:flex; flex-direction:column; gap:12px; width:100%; }
        #dashboard-view .skeleton { height:42px; width:100%; background:rgba(201,164,97,0.05); background-image:linear-gradient(90deg,rgba(201,164,97,0.02) 0,rgba(201,164,97,0.08) 40px,rgba(201,164,97,0.02) 80px); background-size:200% 100%; animation:shimmer 1.5s infinite linear; border-radius:6px; border:1px solid var(--charcoal-border); }
        #dashboard-view footer { width:100%; padding:30px 0; text-align:center; margin-top:auto; color:var(--cream-dim); font-size:10px; }
        
        /* ========================================================
           MCQ TEST CSS (Unchanged)
           ======================================================== */
        #mcq-view {
            --q-font-size: 15px; --opt-font-size: 13px;
            --primary: #4F46E5; --primary-light: #A5B4FC; --primary-dim: rgba(79, 70, 229, 0.10); --primary-glow: rgba(79, 70, 229, 0.22);
            --bg-page: #FFFFFF; --bg-desktop: #D4D7EE; --bg-print: #4A4B68;
            --shadow-page: 0 2px 6px rgba(0,0,0,0.06), 0 10px 28px rgba(0,0,0,0.08), 0 28px 56px rgba(79,70,229,0.05);
            --shadow-nav: 0 1px 0 rgba(255,255,255,0.9) inset, 0 4px 16px rgba(0,0,0,0.07), 0 8px 40px rgba(79,70,229,0.10);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --emerald-700: #0B3D30; --emerald-600: #0F5C46; --emerald-wash: rgba(15, 92, 70, 0.13); --gold-500: #B8935A; --gold-600: #9A7A42; --charcoal: #16241F; --cream: #F5EFE0; --danger: #B5533E; --danger-wash: rgba(181, 83, 62, 0.13); --violet: #6D28D9;
            --print-margin-top: 8mm; --print-margin-right: 6mm; --print-margin-bottom: 8mm; --print-margin-left: 6mm;
            font-family: 'Noto Serif Bengali', 'Lora', serif;
        }
        #mcq-view *, #mcq-view *::before, #mcq-view *::after { box-sizing: border-box; }
        
        #mcq-view .recurring { position: relative; display: inline-block; }
        #mcq-view .dot { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 15px; }
        #mcq-view .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.9em; line-height: 1.1; margin: 0 2px; }
        #mcq-view .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
        #mcq-view .frac span:last-child { padding: 0 2px; }
        #mcq-view sup { line-height: 0; font-size: 0.7em; }

        #mcq-view .top-nav-container { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; z-index: 3000; width: max-content; max-width: 98vw; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(22px) saturate(190%); -webkit-backdrop-filter: blur(22px) saturate(190%); border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 40px; padding: 5px 10px; box-shadow: var(--shadow-nav); }
        #mcq-view .nav-sep { flex-shrink: 0; width: 1px; height: 16px; background: rgba(79, 70, 229, 0.16); border-radius: 1px; margin: 0 2px; }
        #mcq-view .action-group { display: flex; align-items: center; gap: 2px; }
        #mcq-view .floating-stats { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 22px; font-family: 'Hind Siliguri', sans-serif; font-size: 11px; font-weight: 700; color: #374151; white-space: nowrap; user-select: none; cursor: pointer; }
        #mcq-view .floating-stats svg { width: 12px; height: 12px; display: block; }
        #mcq-view .floating-stats .stat-timer { display: inline-flex; align-items: center; gap: 3px; color: var(--danger); }
        #mcq-view .floating-stats .timer-val, #mcq-view .floating-stats .rem-q { font-family: 'Cutive Mono', monospace; font-weight: 700; letter-spacing: 0.2px; }
        #mcq-view .nav-icon-btn { border: none; width: 26px; height: 22px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; position: relative; transition: background 0.2s var(--ease), transform 0.18s var(--spring), box-shadow 0.24s var(--ease), color 0.2s var(--ease); }
        #mcq-view .nav-icon-btn svg { width: 15px; height: 15px; display: block; }
        #mcq-view .nav-icon-btn:active { transform: scale(0.86); }
        #mcq-view .nav-icon-btn.save-tone { color: var(--emerald-600); background: var(--emerald-wash); }
        #mcq-view .nav-icon-btn.save-tone:hover { background: rgba(15, 92, 70, 0.22); box-shadow: 0 3px 10px rgba(15, 92, 70, 0.28); transform: translateY(-1px); }
        #mcq-view .nav-icon-btn.danger-tone { color: var(--danger); background: var(--danger-wash); }
        #mcq-view .nav-icon-btn.danger-tone:hover { background: rgba(181, 83, 62, 0.22); box-shadow: 0 3px 10px rgba(181, 83, 62, 0.28); transform: translateY(-1px); }
        #mcq-view .nav-icon-btn.gold-tone { color: var(--gold-600); background: rgba(184, 147, 90, 0.14); }
        #mcq-view .nav-icon-btn.gold-tone:hover { background: rgba(184, 147, 90, 0.26); box-shadow: 0 3px 10px rgba(184, 147, 90, 0.3); transform: translateY(-1px); }
        #mcq-view .nav-icon-btn.gold-tone.is-active { background: var(--gold-500); color: #fff; box-shadow: 0 2px 8px rgba(184, 147, 90, 0.45); }
        #mcq-view .nav-icon-btn.violet-tone { color: var(--violet); background: rgba(109, 40, 217, 0.10); }
        #mcq-view .nav-icon-btn.violet-tone:hover { background: rgba(109, 40, 217, 0.20); box-shadow: 0 3px 10px rgba(109, 40, 217, 0.26); transform: translateY(-1px); }
        #mcq-view .nav-icon-btn.violet-tone.is-active { background: var(--violet); color: #fff; box-shadow: 0 2px 8px rgba(109, 40, 217, 0.45); }
        #mcq-view .view-switcher { display: flex; gap: 2px; padding: 2px; border-radius: 18px; background: var(--primary-dim); align-items: center; position: relative; }
        #mcq-view .view-switcher-indicator { position: absolute; top: 2px; left: 2px; height: 22px; border-radius: 14px; background: var(--primary); box-shadow: 0 2px 8px var(--primary-glow); transition: transform 0.32s var(--spring), width 0.32s var(--spring); z-index: 0; }
        #mcq-view .view-btn { border: none; padding: 0 8px; height: 22px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: #374151; position: relative; z-index: 1; transition: color 0.22s var(--ease), transform 0.18s var(--spring); }
        #mcq-view .view-btn svg { width: 14px; height: 14px; display: block; }
        #mcq-view .view-btn:not(.active):hover { color: var(--primary); }
        #mcq-view .view-btn:active { transform: scale(0.88); }
        #mcq-view .view-btn.active { color: white; }

        #mcq-view .page { width: 210mm; height: 297mm; padding: 5mm 8mm 15mm 8mm; margin: 10mm auto; background: var(--bg-page); box-shadow: var(--shadow-page); box-sizing: border-box; position: relative; page-break-after: always; overflow: hidden; border-radius: 6px; display: flex; flex-direction: column; }
        #mcq-view .content-columns { display: flex; flex-direction: column; flex-wrap: wrap; flex: 1 1 auto; min-height: 0; column-gap: 10mm; justify-content: flex-start; position: relative; }
        body.mcq-print-mode #mcq-view .content-columns::after, body.mcq-desktop-mode #mcq-view .content-columns::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        #mcq-view .q-card { width: calc(50% - 5mm); break-inside: avoid; margin-bottom: 5px; padding: 5px; padding-bottom: 8px; border-bottom: 1px dashed rgba(79, 70, 229, 0.18); box-sizing: border-box; border-radius: 4px; }
        
        body.mcq-mobile-mode #mcq-view .page { width: 95%; height: auto; min-height: auto; margin: 55px auto 20px auto; padding: 15px; box-shadow: none; overflow: visible; border-top: 3px solid var(--primary); display: block; }
        body.mcq-mobile-mode #mcq-view .content-columns { display: block; height: auto; column-gap: 0; }
        body.mcq-mobile-mode #mcq-view .q-card { width: 100%; margin-bottom: 15px; padding: 14px; box-sizing: border-box; border: 1px solid rgba(79, 70, 229, 0.10); border-bottom: 1px solid rgba(79, 70, 229, 0.10); background: var(--bg-page); border-radius: 10px; box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 6px 20px rgba(79,70,229,0.06); }
        
        #mcq-view .header { text-align: center; margin-top: 0; margin-bottom: 8px; border-bottom: 1px solid rgba(79, 70, 229, 0.12); padding-bottom: 4px; }
        #mcq-view .header h2 { margin: 0; font-weight: 700; letter-spacing: 0.4px; font-size: 15px; text-transform: uppercase; font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(118deg, var(--primary) 20%, #818CF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        #mcq-view .q-text { font-size: var(--q-font-size); font-weight: bold; display: block; margin-bottom: 5px; color: #1E293B; transition: font-size 0.2s; }
        #mcq-view .option-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        #mcq-view .option-btn { padding: 3px 8px; background: #F8F9FC; border: 1px solid rgba(79, 70, 229, 0.14); border-radius: 6px; cursor: pointer; font-size: var(--opt-font-size); text-align: left; color: #1E293B; transition: background 0.18s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease), transform 0.15s var(--spring), box-shadow 0.18s var(--ease); }
        #mcq-view .option-btn:hover { background: var(--primary-dim); border-color: var(--primary-light); }
        #mcq-view .option-btn.blur-logic { filter: blur(5px); user-select: none; transition: filter 0.3s ease; }
        #mcq-view .option-btn.selected, #mcq-view .option-btn.opt-correct, #mcq-view .option-btn.opt-wrong, #mcq-view .option-btn.opt-missed { filter: blur(0) !important; }
        #mcq-view .option-btn.selected { background: var(--primary-dim); color: var(--primary); border-color: var(--primary-light); font-weight: bold; }
        #mcq-view .option-btn.opt-correct { background: var(--emerald-wash) !important; color: var(--emerald-700) !important; border-color: var(--emerald-600) !important; font-weight: bold; }
        #mcq-view .option-btn.opt-wrong { background: var(--danger-wash) !important; color: var(--danger) !important; border-color: var(--danger) !important; font-weight: bold; }
        #mcq-view .option-btn.opt-missed { background: rgba(184, 147, 90, 0.16) !important; color: var(--gold-600) !important; border-color: var(--gold-500) !important; font-weight: bold; }
        #mcq-view .locked-card { pointer-events: none; opacity: 0.85; }
        #mcq-view .locked-card .option-btn.opt-correct { background: #E4E6F5 !important; color: #4A4B68 !important; border-color: #B7BBE0 !important; font-weight: bold; }

        #mcq-view .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 4000; justify-content: center; align-items: center; }
        #mcq-view .result-modal { background: var(--bg-page); padding: 26px; border-radius: 16px; width: 320px; text-align: center; font-family: 'Noto Serif Bengali', 'Lora', serif; box-shadow: var(--shadow-page); border: 1px solid rgba(79, 70, 229, 0.10); }
        #mcq-view .result-modal h3 { margin-top: 0; font-family: 'Hind Siliguri', sans-serif; font-weight: 700; letter-spacing: 0.3px; background: linear-gradient(118deg, var(--primary) 20%, #818CF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; border-bottom: 1px solid rgba(79, 70, 229, 0.12); padding-bottom: 10px; }
        #mcq-view .result-modal p { font-size: 17px; margin: 10px 0; line-height: 1.6; color: #1E293B; }
        #mcq-view .close-modal-btn { background: var(--primary); color: white; border: none; padding: 9px 26px; border-radius: 999px; cursor: pointer; font-size: 15px; margin-top: 14px; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; box-shadow: 0 4px 14px var(--primary-glow); transition: transform 0.18s var(--spring), box-shadow 0.18s var(--ease); }
        #mcq-view .close-modal-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--primary-glow); }
        #mcq-view .close-modal-btn:active { transform: scale(0.96); }
        
        #mcq-view .footer { flex-shrink: 0; display: flex; justify-content: center; text-align: center; font-size: 11px; line-height: 1.2; word-spacing: -1.5px; border-top: 1px solid rgba(15, 23, 42, 0.25); padding-top: 5px; color: #475569; font-family: 'Cutive Mono', 'Hind Siliguri', monospace; font-weight: 300; }
        body.mcq-mobile-mode #mcq-view .footer { margin-top: 20px; padding-bottom: 10px; }
        
        #mcq-view .result-fab { position: fixed; bottom: 25px; right: 25px; background: linear-gradient(135deg, #0F5C46 0%, #16966F 100%); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(11, 61, 48, 0.38), 0 2px 8px rgba(11, 61, 48, 0.22), 0 0 0 0 rgba(15, 92, 70, 0.4); border: none; z-index: 999; transition: transform 0.2s var(--spring), box-shadow 0.3s var(--ease), background 0.35s var(--ease); animation: fab-pulse 2.8s ease-in-out infinite; }
        #mcq-view .result-fab.is-reset { background: linear-gradient(135deg, #4F46E5 0%, #7C72F0 100%); animation: fab-pulse-indigo 2.8s ease-in-out infinite; }
        #mcq-view .result-fab:hover { transform: translateY(-3px) scale(1.05); }
        #mcq-view .result-fab:active { transform: scale(0.9); }
        #mcq-view .result-fab svg { width: 26px; height: 26px; fill: white; }
        
        #mcq-view #mcq-loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(150deg, #F0F1FF 0%, #EBEEFF 100%); display: flex; flex-direction: column; align-items: center; padding-top: 14px; z-index: 5000; overflow: hidden; }
        #mcq-view .skeleton-nav { display: flex; gap: 6px; margin-bottom: 32px; align-items: center; width: max-content; background: rgba(255, 255, 255, 0.80); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 40px; padding: 6px 14px; box-shadow: var(--shadow-nav); }
        #mcq-view .skeleton-pill { height: 22px; border-radius: 14px; }
        #mcq-view .skeleton-container { width: 90%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        #mcq-view .skeleton-card { background: var(--bg-page); padding: 15px; border-radius: 10px; border: 1px solid rgba(79, 70, 229, 0.08); box-shadow: 0 4px 24px rgba(79,70,229,0.07), 0 1px 4px rgba(0,0,0,0.04); }
        .shimmer { background: #E8E9F7; background-image: linear-gradient(90deg, #E8E9F7 0px, #F2F3FF 80px, #E8E9F7 160px); background-size: 400% 100%; animation: shimmer-anim 1.7s infinite linear; border-radius: 6px; }

    <!-- ==========================================================
         COMBINED JAVASCRIPT
         ========================================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcS1zWFslmbRFS5PAvNrH8TFYIbR8N7ic",
            authDomain: "questionz-me.firebaseapp.com",
            projectId: "questionz-me",
            storageBucket: "questionz-me.firebasestorage.app",
            messagingSenderId: "393630463399",
            appId: "1:393630463399:web:825468121216445828f282",
            databaseURL: "https://questionz-me-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GLOBAL APP STATE ---
        window.currentExamInfo = { parent: '', cat: '', set: '', title: '' };

        window.goBackToDash = function() {
            document.getElementById('mcq-view').classList.remove('active-view');
            document.getElementById('onu-view').classList.remove('active-view');
            document.getElementById('dashboard-view').classList.add('active-view');
            document.body.className = 'body-dashboard';
        };

        window.openMcqView = function() {
            document.getElementById('dashboard-view').classList.remove('active-view');
            document.getElementById('onu-view').classList.remove('active-view');
            document.getElementById('mcq-view').classList.add('active-view');
            document.body.className = 'mcq-mobile-mode'; // trigger MCQ css body class
            mcqFetchData();
        };

        window.openOnuView = function() {
            document.getElementById('dashboard-view').classList.remove('active-view');
            document.getElementById('mcq-view').classList.remove('active-view');
            document.getElementById('onu-view').classList.add('active-view');
            document.body.className = 'onu-mobile-mode'; // trigger Onu css body class
            onuFetchData();
        };


        // ==========================================
        // DASHBOARD LOGIC
        // ==========================================
        let historyStack = JSON.parse(sessionStorage.getItem('qz_history')) || ["root"];
        let breadcrumbs = JSON.parse(sessionStorage.getItem('qz_breadcrumbs')) || [];
        let unsubscribe = null;
        const categoryCache = new Map(), metadataCache = new Map();
        const grid = document.getElementById('category-grid'), loading = document.getElementById('dash-loading'), breadcrumbContainer = document.getElementById('breadcrumb-container');

        function updateUI(id) { loadCategories(id); renderBreadcrumbs(); }
        function saveState() { sessionStorage.setItem('qz_history', JSON.stringify(historyStack)); sessionStorage.setItem('qz_breadcrumbs', JSON.stringify(breadcrumbs)); }
        
        window.jumpTo = function(i) {
            if (i === -1) { historyStack = ["root"]; breadcrumbs = []; } 
            else { historyStack = historyStack.slice(0, i + 1); breadcrumbs = breadcrumbs.slice(0, i + 1); } // fix slicing for breadcrumb logic
            saveState(); updateUI(historyStack[historyStack.length - 1]);
        };
        
        function renderBreadcrumbs() {
            while (breadcrumbContainer.children.length > 1) breadcrumbContainer.removeChild(breadcrumbContainer.lastChild);
            breadcrumbs.forEach((name, i) => {
                const s = document.createElement('div'); s.innerText = ">"; s.className = "separator"; breadcrumbContainer.appendChild(s);
                const item = document.createElement('div'); item.className = 'breadcrumb-item'; item.innerText = name;
                item.onclick = () => jumpTo(i); breadcrumbContainer.appendChild(item);
            });
        }

        async function loadSetsFromMetadata(s, c) {
            const k = `${s}_${c}`;
            if (metadataCache.has(k)) { renderSets(metadataCache.get(k), s, c); return; }
            try {
                const m = await getDoc(doc(db, s, c, 'sets', '_metadata'));
                if (m.exists()) {
                    const d = m.data(); metadataCache.set(k, d); await renderSets(d, s, c);
                }
            } catch (e) { console.error("Metadata Load Error:", e); }
        }

        async function renderSets(d, s, c) {
            if (c !== historyStack[historyStack.length - 1]) return;
            const keys = Object.keys(d).sort(), fragment = document.createDocumentFragment();
            const promises = keys.map(async (k) => {
                if (document.getElementById(`set-${k}`)) return null;
                const info = d[k]; let p = 0;
                try {
                    // Check local storage for progress instead of Auth DB
                    let localMCQProg = localStorage.getItem(`qz_prog_${s}_${c}_${k}`);
                    if(localMCQProg) { p = JSON.parse(localMCQProg).percent || 0; }
                } catch(e) {}
                return { k, info, p };
            });
            const resolved = await Promise.all(promises);
            resolved.forEach(item => {
                if (!item) return;
                const { k, info, p } = item, title = info.title || k, display = title.length > 30 ? title.substring(0, 30) + "..." : title;
                const box = document.createElement('div'); box.id = `set-${k}`; box.className = 'noun-box';
                box.innerHTML = `<span>${display}</span><div class="progress-percent">${p}%</div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${Math.min(100, p)}%"></div></div>`;
                box.onclick = () => {
                    let cid = (k || "").trim().toLowerCase();
                    window.currentExamInfo = { parent: s, cat: c, set: k, title: display };
                    localStorage.setItem('qz_current_path', ['Home', ...breadcrumbs, display].join(' > '));
                    
                    if (cid.endsWith('_onu')) openOnuView();
                    else openMcqView();
                };
                fragment.appendChild(box);
            });
            if (c === historyStack[historyStack.length - 1]) { grid.appendChild(fragment); loading.style.display = "none"; }
        }

        function renderItems(items, pId) {
            if (pId !== historyStack[historyStack.length - 1]) return;
            const f = document.createDocumentFragment();
            items.forEach(cat => {
                if (!document.getElementById(`cat-${cat.id}`)) {
                    const display = cat.name.length > 30 ? cat.name.substring(0, 30) + "..." : cat.name;
                    const box = document.createElement('div'); box.id = `cat-${cat.id}`; box.className = 'noun-box';
                    box.innerHTML = `<span>${display}</span>`;
                    box.onclick = () => {
                        historyStack.push(cat.id); breadcrumbs.push(cat.name); saveState();
                        updateUI(cat.id);
                    };
                    f.appendChild(box);
                }
            });
            grid.appendChild(f); loading.style.display = "none";
        }

        function loadCategories(pId) {
            if (unsubscribe) unsubscribe();
            grid.innerHTML = ""; loading.style.display = "flex";
            const sId = historyStack[1];
            if (pId !== "root" && sId) loadSetsFromMetadata(sId, pId);
            const q = query(collection(db, "categories"), where("parentId", "==", pId));
            unsubscribe = onSnapshot(q, s => {
                const items = [];
                s.forEach(doc => { if (doc.id !== "_metadata") items.push({ id: doc.id, ...doc.data() }) });
                items.sort((a, b) => {
                    if (a.order !== undefined && b.order !== undefined) return a.order - b.order;
                    return (parseInt(a.name) || 0) - (parseInt(b.name) || 0);
                });
                if (items.length > 0) { categoryCache.set(pId, items); renderItems(items, pId); }
                else if (pId === "root") { loading.style.display = "none"; grid.innerHTML = "<p style='text-align:center;font-size:14px;color:#B9B2A0;font-family:\"Bensen\",sans-serif;'>কোনো ক্যাটাগরি পাওয়া যায়নি।</p>"; }
                else { setTimeout(() => { if (grid.children.length === 0 && pId === historyStack[historyStack.length - 1]) { loading.style.display = "none"; grid.innerHTML = "<p style='text-align:center;font-size:14px;color:#B9B2A0;font-family:\"Bensen\",sans-serif;'>কিছুই পাওয়া যায়নি।</p>"; } }, 6000); }
            });
        }

        // Initialize Dashboard
        updateUI("root");


        // ==========================================
        // MCQ LOGIC
        // ==========================================
        let mcqData = [], mcq_userAnswers = {}, mcq_lockedIds = new Set(), mcq_totalQuestionsCount = 0;
        let mcq_timerInterval = null, mcq_isShuffled = false, mcq_currentQFontSize = 15, mcq_currentOptFontSize = 13;
        
        const mcq_getProgressDocRef = () => `qz_prog_${window.currentExamInfo.parent}_${window.currentExamInfo.cat}_${window.currentExamInfo.set}`;
        const mcq_tempStorageKey = () => `temp_ans_${window.currentExamInfo.parent}_${window.currentExamInfo.cat}_${window.currentExamInfo.set}`;
        const fR = (text) => text ? text.toString().replace(/([০-৯0-9])\u0307/g, '<span class="recurring">$1<span class="dot">.</span></span>') : "";
        const toBengaliNumber = (n) => n.toString().split('').map(digit => ['০','১','২','৩','৪','৫','৬','৭','৮','৯'][digit] || digit).join('');
        const mcq_shuffle = (array) => { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } };

        window.mcqIncreaseFontSize = function() { mcq_currentQFontSize += 1; mcq_currentOptFontSize += 1; document.getElementById('mcq-view').style.setProperty('--q-font-size', mcq_currentQFontSize + 'px'); document.getElementById('mcq-view').style.setProperty('--opt-font-size', mcq_currentOptFontSize + 'px'); if(mcqData.length > 0) setTimeout(() => mcq_paginate(), 10); };
        window.mcqDecreaseFontSize = function() { if (mcq_currentQFontSize > 10) { mcq_currentQFontSize -= 1; mcq_currentOptFontSize -= 1; document.getElementById('mcq-view').style.setProperty('--q-font-size', mcq_currentQFontSize + 'px'); document.getElementById('mcq-view').style.setProperty('--opt-font-size', mcq_currentOptFontSize + 'px'); if(mcqData.length > 0) setTimeout(() => mcq_paginate(), 10); } };
        
        window.mcqToggleView = function(view) {
            document.body.classList.remove('mcq-mobile-mode', 'mcq-desktop-mode', 'mcq-print-mode');
            document.getElementById('mcq-mobile-view-btn').classList.remove('active');
            document.getElementById('mcq-desktop-view-btn').classList.remove('active');
            document.getElementById('mcq-print-view-btn').classList.remove('active');
            document.body.classList.add(view + '-mode');
            document.getElementById(view + '-btn').classList.add('active');
            if(mcqData.length > 0) setTimeout(() => mcq_paginate(), 10);
            mcqUpdateViewIndicator();
        };

        function mcqUpdateViewIndicator() {
            const activeBtn = document.querySelector('#mcq-view .view-btn.active');
            const indicator = document.getElementById('mcq-view-switcher-indicator');
            if (activeBtn && indicator) { indicator.style.width = activeBtn.offsetWidth + 'px'; indicator.style.transform = `translateX(${activeBtn.offsetLeft - 2}px)`; }
        }

        async function mcqFetchData() {
            document.getElementById("mcq-loading-screen").style.display = "flex";
            document.getElementById('mcq-pages-container').innerHTML = ''; // reset
            mcqData = []; mcq_userAnswers = {}; mcq_lockedIds.clear(); mcq_totalQuestionsCount = 0; if(mcq_timerInterval) clearInterval(mcq_timerInterval);
            try {
                const docRef = doc(db, window.currentExamInfo.parent, window.currentExamInfo.cat, "sets", window.currentExamInfo.set);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const rawQuestions = data.questions;
                    mcqData = rawQuestions.map((q, index) => {
                        let correctKey = q.ans;
                        if (q.ans && !['a','b','c','d'].includes(q.ans)) { const idx = q.options.indexOf(q.ans); if (idx !== -1) correctKey = ['a','b','c','d'][idx]; }
                        return { id: index + 1, q: q.question, a: q.options[0], b: q.options[1], c: q.options[2], d: q.options[3], ans: correctKey, orig_a: q.options[0], orig_b: q.options[1], orig_c: q.options[2], orig_d: q.options[3], orig_ans: correctKey };
                    });
                    mcq_totalQuestionsCount = mcqData.length;
                    let localSaved = localStorage.getItem(mcq_getProgressDocRef());
                    if (localSaved) { mcq_lockedIds = new Set(JSON.parse(localSaved).locked || []); }
                    mcqInitApp();
                } else {
                    document.getElementById("mcq-loading-screen").innerHTML = "<div style='color:#666; font-size:18px;'>ডেটা পাওয়া যায়নি!</div>";
                }
            } catch (error) { document.getElementById("mcq-loading-screen").innerHTML = "<div style='color:#d93025; font-size:18px;'>এরর: " + error.message + "</div>"; }
        }

        function mcqInitApp() {
            document.getElementById("mcq-loading-screen").style.display = "none";
            const savedTemp = localStorage.getItem(mcq_tempStorageKey());
            if (savedTemp) { mcq_userAnswers = JSON.parse(savedTemp); }
            let activeQ = mcqData.filter(q => !mcq_lockedIds.has(q.id));
            let lockedQ = mcqData.filter(q => mcq_lockedIds.has(q.id));
            mcqData = [...activeQ, ...lockedQ];
            mcq_paginate();
            document.fonts.ready.then(() => { if(mcqData.length > 0) mcq_paginate(); });
            mcqStartTimer(activeQ.length);
        }

        window.mcqSaveProgress = async function() {
            const saveBtn = document.getElementById('cloud-save-btn'); const originalText = saveBtn.innerHTML; saveBtn.innerHTML = '<svg class="btn-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
            Object.keys(mcq_userAnswers).forEach(id => { const qId = Number(id); const questionItem = mcqData.find(q => q.id === qId); if (questionItem && mcq_userAnswers[id] === questionItem[questionItem.ans]) { mcq_lockedIds.add(qId); } });
            const progressPercent = mcq_totalQuestionsCount > 0 ? Math.min(100, Math.round((mcq_lockedIds.size / mcq_totalQuestionsCount) * 100)) : 0;
            localStorage.setItem(mcq_getProgressDocRef(), JSON.stringify({ locked: Array.from(mcq_lockedIds), percent: progressPercent }));
            localStorage.removeItem(mcq_tempStorageKey());
            Swal.fire({ icon: 'success', title: 'সেভ সফল!', text: 'আপনার প্রগ্রেস ব্রাউজারে সেভ হয়েছে।', timer: 2000, showConfirmButton: false });
            mcq_userAnswers = {}; mcq_paginate(); saveBtn.innerHTML = originalText;
        };

        window.mcqUnlockAllProgress = async function() {
            const result = await Swal.fire({ title: 'সব প্রশ্ন আনলক করবেন?', text: "আপনার সংরক্ষিত সব প্রগ্রেস মুছে যাবে!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#B5533E', cancelButtonColor: '#4F46E5', confirmButtonText: 'হ্যাঁ, আনলক করুন!', cancelButtonText: 'বাতিল' });
            if (result.isConfirmed) { mcq_lockedIds.clear(); mcq_userAnswers = {}; localStorage.removeItem(mcq_tempStorageKey()); localStorage.removeItem(mcq_getProgressDocRef()); Swal.fire('সফল!', 'সব আনলক করা হয়েছে।', 'success'); mcqInitApp(); }
        };

        window.mcqToggleAllBlur = function() {
            const btn = document.getElementById('blur-toggle-btn'); const options = document.querySelectorAll('#mcq-view .option-btn');
            if (btn.classList.contains('is-active')) { options.forEach(opt => opt.classList.remove('blur-logic')); btn.classList.remove('is-active'); btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3"/></svg>'; }
            else { options.forEach(opt => { const card = opt.closest('.q-card'); if (!opt.classList.contains('selected') && !opt.classList.contains('opt-correct') && !(card && card.classList.contains('locked-card'))) { opt.classList.add('blur-logic'); } }); btn.classList.add('is-active'); btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="4" x2="20" y2="20"/></svg>'; }
        };

        window.mcqToggleShuffle = function() {

            if (onu_startIndex === -1 || onu_endIndex === -1) return; const selectedText = onu_clusters.slice(onu_startIndex, onu_endIndex + 1).join('');
            if (onu_currentMode === 'unmark') { for (let i = onu_startIndex; i <= onu_endIndex; i++) if (onu_spans[i]) onu_spans[i].classList.remove('marked'); onu_markedRanges = onu_markedRanges.filter(r => !(r.start === onu_startIndex && r.end === onu_endIndex)); window.onu_showToast(selectedText, 'unmark'); } 
            else { for (let i = onu_startIndex; i <= onu_endIndex; i++) if (onu_spans[i]) onu_spans[i].classList.add('marked'); onu_markedRanges.push({ start: onu_startIndex, end: onu_endIndex }); window.onu_showToast(selectedText, 'mark'); }
            onu_updateBlankNumbers(); window.onuAutoSaveMarks(); window.onu_clearSelectionUI();
        };

        document.getElementById('onu-view').addEventListener('pointerdown', (e) => {
            if (document.body.classList.contains('onu-print-mode')) return;
            if (e.target.tagName === 'SPAN' && e.target.hasAttribute('data-index')) {
                let index = parseInt(e.target.dataset.index); const existing = window.onu_findMarkedRangeAt(index);
                if (existing) { onu_startIndex = existing.start; onu_endIndex = existing.end; onu_wordStart = existing.start; onu_wordEnd = existing.end; onu_currentMode = 'unmark'; } 
                else { onu_startIndex = index; onu_endIndex = index; while (onu_startIndex > 0 && !/^(\s+|[।!?]+)$/.test(onu_clusters[onu_startIndex - 1])) onu_startIndex--; while (onu_endIndex < onu_clusters.length - 1 && !/^(\s+|[।!?]+)$/.test(onu_clusters[onu_endIndex + 1])) onu_endIndex++; onu_wordStart = onu_startIndex; onu_wordEnd = onu_endIndex; onu_currentMode = 'mark'; }
                window.onu_setTooltipMode(onu_currentMode); window.onu_refreshSpanRects(); window.onu_updateUI();
            } else if (e.target.id !== 'tooltip' && e.target.closest('#tooltip') === null && !e.target.classList.contains('grabber') && !e.target.closest('.top-nav-container')) { window.onu_clearSelectionUI(); }
        });

        grabberLeft.addEventListener('pointerdown', (e) => { onu_isDragging = 'left'; window.onu_refreshSpanRects(); e.preventDefault(); e.stopPropagation(); });
        grabberRight.addEventListener('pointerdown', (e) => { onu_isDragging = 'right'; window.onu_refreshSpanRects(); e.preventDefault(); e.stopPropagation(); });
        window.onu_processDragFrame = function() {
            onu_rafPending = false; if (!onu_isDragging || !onu_lastPointerEvent) return; const e = onu_lastPointerEvent; let closestIndex = -1; let minDistSq = Infinity;
            for (let i = onu_wordStart; i <= onu_wordEnd; i++) { const rect = onu_spanRects[i]; if (!rect) continue; const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2; const dx = e.clientX - centerX; const dy = e.clientY - centerY; const distSq = dx * dx + dy * dy; if (distSq < minDistSq) { minDistSq = distSq; closestIndex = i; } }
            if (closestIndex !== -1) { if (onu_isDragging === 'left') onu_startIndex = closestIndex; else onu_endIndex = closestIndex; window.onu_updateUI(); }
        };
        window.addEventListener('pointermove', (e) => { if (!onu_isDragging) return; onu_lastPointerEvent = e; if (!onu_rafPending) { onu_rafPending = true; requestAnimationFrame(window.onu_processDragFrame); } }, { passive: true });
        window.addEventListener('pointerup', () => { onu_isDragging = null; onu_lastPointerEvent = null; });
        tooltip.addEventListener('click', window.onu_confirmMark);

        window.onuExportMarkedJSON = function() { Swal.fire('Info', 'এক্সপোর্ট কোড এখানে যুক্ত করুন।', 'info'); }; // Placeholder for export
    </script>
