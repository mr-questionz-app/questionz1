<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionz - Dashboard & Test</title>
    
    <!-- Dashboard Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Indie+Flower&family=Montserrat:wght@700;900&family=Poppins:wght@400;600&family=Segoe+UI:wght@400;600&family=Cutive+Mono&family=Cuprum:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.maateen.me/bensen/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/hoogly/font.css" rel="stylesheet">
    
    <!-- Test & Onuched Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* ==========================================
           GLOBAL & DASHBOARD STYLES
           ========================================== */
        :root {
            --primary-color: #1B251E; --secondary-color: #C9A461; --bg-color: #0B100E;
            --card-bg: #1B251E; --text-color: #F4EFE3; --gold-accent: #C9A461;
            --gold-gradient: linear-gradient(135deg, #C9A461, #fcf6ba);
            --charcoal-800-hover: #223028; --charcoal-border: rgba(201,164,97,0.14); --cream-dim: #B9B2A0;
            
            /* Test Tokens */
            --q-font-size: 15px; --opt-font-size: 13px;
            --primary: #4F46E5; --primary-light: #A5B4FC; --primary-dim: rgba(79, 70, 229, 0.10); --primary-glow: rgba(79, 70, 229, 0.22);
            --bg-page: #FFFFFF; --bg-desktop: #D4D7EE; --bg-print: #4A4B68;
            --shadow-page: 0 2px 6px rgba(0,0,0,0.06), 0 10px 28px rgba(0,0,0,0.08), 0 28px 56px rgba(79,70,229,0.05);
            --shadow-nav: 0 1px 0 rgba(255,255,255,0.9) inset, 0 4px 16px rgba(0,0,0,0.07), 0 8px 40px rgba(79,70,229,0.10);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --emerald-700: #0B3D30; --emerald-600: #0F5C46; --emerald-wash: rgba(15, 92, 70, 0.13);
            --gold-500: #B8935A; --gold-600: #9A7A42; --danger: #B5533E; --danger-wash: rgba(181, 83, 62, 0.13); --violet: #6D28D9;
            --charcoal: #16241F; --cream: #F5EFE0;
            --print-margin-top: 8mm; --print-margin-right: 6mm; --print-margin-bottom: 8mm; --print-margin-left: 6mm;
        }

        body {
            font-family: 'Cuprum', sans-serif; font-weight: 400; background: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            transition: background-color 0.35s var(--ease); position: relative;
        }

        /* Dashboard Specific Elements */
        #dashboard-view { width: 100%; display: flex; flex-direction: column; align-items: center; }
        nav.dash-nav { width: 100%; padding: 5px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(18,26,21,0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--charcoal-border); box-sizing: border-box; }
        .logo-wrapper { display: flex; align-items: center; gap: 12px; }
        .logo-text { font-family: 'Cuprum', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; background: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 5px rgba(201,164,97,0.5)); width: 26px; height: 26px; border: 1px solid rgba(201,164,97,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(201,164,97,0.2); flex-shrink: 0; }
        header.dash-header { text-align: left; width: 90%; max-width: 900px; margin-top: 10px; margin-bottom: 5px; }
        .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
        .breadcrumb-item { background: var(--card-bg); border: 1px solid var(--charcoal-border); padding: 2px 7px; border-radius: 4px; font-family: 'Cuprum','Hoogly','Bensen',sans-serif; font-size: 11px; font-weight: 400; color: var(--gold-accent); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; user-select: none; }
        .breadcrumb-item:hover { background: var(--charcoal-800-hover); border-color: var(--gold-accent); transform: translateY(-1px); }
        .separator { color: var(--cream-dim); font-size: 9px; font-weight: normal; }
        .wave-text { font-family: 'Cuprum', sans-serif; font-size: 1.1rem; font-weight: 400; margin: 0; padding: 0; text-transform: uppercase; color: var(--text-color); display: inline-block; line-height: 1; letter-spacing: 0.15rem; filter: drop-shadow(0 0 8px rgba(0,0,0,0.3)); }
        .divider { width: 90%; max-width: 900px; height: 1px; background: linear-gradient(to right,rgba(201,164,97,0),rgba(201,164,97,0.2),rgba(201,164,97,0)); margin: 15px 0 5px 0; }
        .noun-section-wrapper { padding: 10px 0; width: 280px; max-width: 95%; box-sizing: border-box; margin-top: 5px; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .noun-box { position: relative; height: 42px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(27,37,30,0.7), rgba(18,26,21,0.9)); overflow: hidden; border-radius: 6px; text-decoration: none; border: 1px solid var(--charcoal-border); cursor: pointer; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; transition: all .3s ease; }
        .noun-box span { position: relative; z-index: 2; font-family: 'Cuprum','Hoogly','Bensen',sans-serif; font-size: 15px; font-weight: 400; color: var(--text-color); white-space: nowrap; pointer-events: none; }
        .progress-percent { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; color: var(--text-color); background: rgba(201,164,97,0.15); padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(201,164,97,0.25); box-shadow: inset 0 0 8px rgba(201,164,97,0.05), 0 2px 5px rgba(0, 0, 0, 0.3); backdrop-filter: blur(5px); display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; transition: all 0.3s ease; }
        .progress-percent::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--gold-accent); border-radius: 50%; box-shadow: 0 0 6px var(--gold-accent), 0 0 10px var(--gold-accent); animation: pulse-dot 2s infinite ease-in-out; }
        @keyframes pulse-dot { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--gold-accent), 0 0 18px var(--gold-accent); } 100% { transform: scale(0.9); opacity: 0.7; } }
        .progress-bar-bg { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(244,239,227,0.05); width: 100%; z-index: 1; border-radius: 0 0 6px 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, rgba(53,168,131,0.6), var(--gold-accent)); box-shadow: 0 -1px 8px rgba(201,164,97,0.5); border-radius: 0 4px 4px 0; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .noun-box:hover { background: var(--charcoal-800-hover); border-color: var(--gold-accent); transform: translateY(-2px); }
        #loading { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .skeleton { height: 42px; width: 100%; background: rgba(201,164,97,0.05); background-image: linear-gradient(90deg,rgba(201,164,97,0.02) 0,rgba(201,164,97,0.08) 40px,rgba(201,164,97,0.02) 80px); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 6px; border: 1px solid var(--charcoal-border); }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        footer.dash-footer { width: 100%; padding: 30px 0; text-align: center; margin-top: auto; color: var(--cream-dim); font-size: 10px; }

        /* ==========================================
           TEST & ONUCHED SHARED UI STYLES
           ========================================== */
        body.test-active, body.onuched-active { font-family: 'Noto Serif Bengali', 'Lora', serif; background-color: var(--bg-desktop); }
        body.test-active #dashboard-view, body.onuched-active #dashboard-view { display: none !important; }
        
        #test-view, #onuched-view { width: 100%; display: none; flex-direction: column; align-items: center; min-height: 100vh; position: relative; }
        body.test-active #test-view { display: flex; }
        body.onuched-active #onuched-view { display: flex; }

        *, *::before, *::after { box-sizing: border-box; }
        .recurring { position: relative; display: inline-block; }
        .dot { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 15px; }
        .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.9em; line-height: 1.1; margin: 0 2px; }
        .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
        .frac span:last-child { padding: 0 2px; }
        sup { line-height: 0; font-size: 0.7em; }

        .top-nav-container { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; z-index: 3000; width: max-content; max-width: 98vw; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(22px) saturate(190%); -webkit-backdrop-filter: blur(22px) saturate(190%); border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 40px; padding: 5px 10px; box-shadow: var(--shadow-nav); }
        .nav-sep { flex-shrink: 0; width: 1px; height: 16px; background: rgba(79, 70, 229, 0.16); border-radius: 1px; margin: 0 2px; }
        .action-group { display: flex; align-items: center; gap: 2px; }
        
        /* Shared Nav Buttons */
        .nav-icon-btn { border: none; width: 26px; height: 22px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; position: relative; transition: background 0.2s var(--ease), transform 0.18s var(--spring), box-shadow 0.24s var(--ease), color 0.2s var(--ease); color:#374151; }
        .nav-icon-btn svg { width: 15px; height: 15px; display: block; }
        .nav-icon-btn:active { transform: scale(0.86); }
        .back-tone { color: #fff; background: var(--danger); width: 32px; font-size:12px; font-weight:bold; }
        .back-tone:hover { background: #9b4735; transform: translateY(-1px); }
        
        /* View Switcher */
        .view-switcher { display: flex; gap: 2px; padding: 2px; border-radius: 18px; background: var(--primary-dim); align-items: center; position: relative; }
        .view-btn { border: none; padding: 0 8px; height: 22px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: #374151; position: relative; z-index: 1; transition: color 0.22s var(--ease), transform 0.18s var(--spring); }
        .view-btn svg { width: 14px; height: 14px; display: block; }
        .view-btn:not(.active):hover { background: rgba(79, 70, 229, 0.12); color: var(--primary); }
        .view-btn:active { transform: scale(0.88); }
        .view-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 8px var(--primary-glow); }

        /* Shared Page Styles */
        .page { width: 210mm; height: 297mm; padding: 5mm 8mm 15mm 8mm; margin: 10mm auto; background: var(--bg-page); box-shadow: var(--shadow-page); box-sizing: border-box; position: relative; page-break-after: always; overflow: hidden; border-radius: 6px; display: flex; flex-direction: column; }
        .grand-header { position: relative; display: none; text-align: center; border-bottom: 1.5px solid #0F172A; padding-bottom: 8px; margin-bottom: 10px; }
        .grand-header h1 { margin: 0; font-size: 36px; font-weight: 900; letter-spacing: 5px; font-family: 'Cinzel', serif; color: #0F172A; }
        .grand-header h3 { margin: 6px 0; font-size: 15px; font-family: 'Cutive Mono', 'Hind Siliguri', monospace; font-weight: 500; color: #000; word-spacing: -1.5px; }
        .qr-code-print { position: absolute; top: 0; right: 0; width: 75px; height: 75px; border-radius: 4px; border: 2px solid #0F172A; padding: 2px; background: #FFFFFF; box-sizing: border-box; }
        .header { text-align: center; margin-top: 0; margin-bottom: 8px; border-bottom: 1px solid rgba(79, 70, 229, 0.12); padding-bottom: 4px; }
        .header h2, .header h3 { margin: 0; font-weight: 700; letter-spacing: 0.4px; font-size: 15px; text-transform: uppercase; font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(118deg, var(--primary) 20%, #818CF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* Modes */
        body.mobile-mode { background: linear-gradient(150deg, #F0F1FF 0%, #EBEEFF 100%); }
        body.mobile-mode .page { width: 95%; height: auto; min-height: 100vh; margin: 55px auto 20px auto; padding: 15px; box-shadow: none; overflow: visible; border-top: 3px solid var(--primary); display: block; border-radius: 0; }
        body.print-mode { background-color: var(--bg-print); }
        body.print-mode .page, body.desktop-mode .page { width: 210mm; height: 297mm; padding: var(--print-margin-top) var(--print-margin-right) var(--print-margin-bottom) var(--print-margin-left); margin: 20px auto; background: var(--bg-page); box-shadow: 0 8px 30px rgba(0,0,0,0.35); border: none; border-radius: 4px; }
        body.print-mode .grand-header, body.desktop-mode .grand-header { display: block; }
        body.print-mode .header, body.desktop-mode .header { display: none; }

        /* Loaders */
        .loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(150deg, #F0F1FF 0%, #EBEEFF 100%); display: flex; flex-direction: column; align-items: center; padding-top: 60px; z-index: 2000; }
        .skeleton-nav { display: flex; gap: 6px; margin-bottom: 32px; align-items: center; width: max-content; background: rgba(255, 255, 255, 0.80); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 40px; padding: 6px 14px; box-shadow: var(--shadow-nav); }
        .skeleton-pill { height: 22px; border-radius: 14px; }
        .shimmer { background: #E8E9F7; background-image: linear-gradient(90deg, #E8E9F7 0px, #F2F3FF 80px, #E8E9F7 160px); background-size: 400% 100%; animation: shimmer-anim 1.7s infinite linear; border-radius: 6px; }
        @keyframes shimmer-anim { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* ==========================================
           TEST (MCQ) SPECIFIC STYLES
           ========================================== */
        .floating-stats { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 22px; font-family: 'Hind Siliguri', sans-serif; font-size: 11px; font-weight: 700; color: #374151; white-space: nowrap; user-select: none; cursor: pointer; }
        .floating-stats .stat-timer { display: inline-flex; align-items: center; gap: 3px; color: var(--danger); }
        .floating-stats .timer-val, .floating-stats .rem-q { font-family: 'Cutive Mono', monospace; font-weight: 700; letter-spacing: 0.2px; }
        .nav-icon-btn.save-tone { color: var(--emerald-600); background: var(--emerald-wash); }
        .nav-icon-btn.danger-tone { color: var(--danger); background: var(--danger-wash); }
        .nav-icon-btn.gold-tone { color: var(--gold-600); background: rgba(184, 147, 90, 0.14); }
        .nav-icon-btn.violet-tone { color: var(--violet); background: rgba(109, 40, 217, 0.10); }

        #test-view .content-columns { display: flex; flex-direction: column; flex-wrap: wrap; flex: 1 1 auto; min-height: 0; column-gap: 10mm; justify-content: flex-start; position: relative; }
        body.print-mode #test-view .content-columns::after, body.desktop-mode #test-view .content-columns::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid #000; }
        body.mobile-mode #test-view .content-columns { display: block; height: auto; column-gap: 0; }
        
        .q-card { width: calc(50% - 5mm); break-inside: avoid; margin-bottom: 5px; padding: 5px; padding-bottom: 8px; border-bottom: 1px dashed rgba(79, 70, 229, 0.18); box-sizing: border-box; border-radius: 4px; }
        body.mobile-mode .q-card { width: 100%; margin-bottom: 15px; padding: 14px; border: 1px solid rgba(79, 70, 229, 0.10); background: var(--bg-page); border-radius: 10px; box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 6px 20px rgba(79,70,229,0.06); }
        body.print-mode .q-card, body.desktop-mode .q-card { width: calc(50% - 5mm); border: none; margin-bottom: 0px; padding: 2px 5px; }
        
        .q-text { font-size: var(--q-font-size); font-weight: bold; display: block; margin-bottom: 5px; color: #1E293B; }
        .option-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .option-btn { padding: 3px 8px; background: #F8F9FC; border: 1px solid rgba(79, 70, 229, 0.14); border-radius: 6px; cursor: pointer; font-size: var(--opt-font-size); text-align: left; color: #1E293B; }
        .option-btn.selected { background: var(--primary-dim); color: var(--primary); border-color: var(--primary-light); font-weight: bold; }
        .option-btn.opt-correct { background: var(--emerald-wash) !important; color: var(--emerald-700) !important; border-color: var(--emerald-600) !important; font-weight: bold; }
        .option-btn.opt-wrong { background: var(--danger-wash) !important; color: var(--danger) !important; border-color: var(--danger) !important; font-weight: bold; }
        .locked-card { pointer-events: none; opacity: 0.85; }

        .result-fab { position: fixed; bottom: 25px; right: 25px; background: linear-gradient(135deg, #0F5C46 0%, #16966F 100%); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(11, 61, 48, 0.38); border: none; z-index: 999; animation: fab-pulse 2.8s ease-in-out infinite; }
        .result-fab svg { width: 26px; height: 26px; fill: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); z-index: 4000; justify-content: center; align-items: center; }
        .result-modal { background: var(--bg-page); padding: 26px; border-radius: 16px; width: 320px; text-align: center; }
        
        /* ==========================================
           ONUCHED SPECIFIC STYLES
           ========================================== */
        #onuched-view .content-area {
            font-size: var(--q-font-size); line-height: 1.45; color: #0F172A; text-align: left; 
            column-count: 2; column-gap: 8mm; column-fill: auto;
            width: 100%; overflow-x: hidden; overflow-y: hidden; box-sizing: border-box;
            word-break: normal; overflow-wrap: break-word; hyphens: none; position: relative; 
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        body.mobile-mode #onuched-view .content-area { column-count: 1; height: auto !important; overflow: visible; column-rule: none; }
        body.print-mode #onuched-view .content-area::after, body.desktop-mode #onuched-view .content-area::after { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 0.5px); border-left: 1px solid #000000; pointer-events: none; z-index: 10; }
        body.print-mode #onuched-view .content-area p, body.desktop-mode #onuched-view .content-area p { margin-top: 0 !important; margin-bottom: 6px !important; }

        /* Premium Marking Styles */
        #onuched-view .content-area span[data-index] { transition: color .15s ease; cursor: text; }
        #onuched-view .content-area span.selecting { color: var(--emerald-700); }
        #onuched-view .content-area span.marked { color: var(--emerald-700); font-weight: 600; text-decoration: underline; text-decoration-color: var(--gold-500); text-decoration-thickness: 2px; text-underline-offset: 4px; }
        
        body.print-mode #onuched-view .content-area span[data-index] { pointer-events: none; }
        body.print-mode #onuched-view .content-area span.marked { display: none !important; }
        body.print-mode #onuched-view .content-area span.marked[data-blank-num] { display: inline-block !important; min-width: 60px; margin: 0 4px; background-color: transparent !important; color: transparent !important; border-bottom: 1.5px dashed #000 !important; pointer-events: none; position: relative; text-decoration: none; font-weight: normal; vertical-align: baseline; line-height: 1; }
        body.print-mode #onuched-view .content-area span.marked[data-blank-num]::after { content: attr(data-blank-num); position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%); color: #000; font-size: 14px; visibility: visible; white-space: nowrap; }

        /* Grabbers & Tooltips */
        #highlight { position: absolute; background: linear-gradient(180deg, rgba(15, 92, 70, 0.16), rgba(15, 92, 70, 0.09)); border-radius: 5px; box-shadow: inset 0 -3px 0 0 rgba(184, 147, 90, 0.55); opacity: 0; visibility: hidden; transform: scaleY(0.4); transform-origin: center; pointer-events: none; z-index: 1000; transition: opacity .16s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
        #highlight.active { opacity: 1; visibility: visible; transform: scaleY(1); }
        .grabber { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #2E8A6B, var(--emerald-600) 55%, var(--emerald-700)); box-shadow: 0 2px 6px rgba(11, 61, 48, 0.4), 0 0 0 3px rgba(184, 147, 90, 0.22); z-index: 1010; cursor: ew-resize; touch-action: none; opacity: 0; visibility: hidden; transition: opacity .16s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
        .grabber::after { content: ''; position: absolute; width: 2px; height: 34px; left: 7px; background: linear-gradient(180deg, var(--emerald-600), var(--gold-500)); border-radius: 1px; }
        #grabber-left { transform: translate(-50%, -16px) scale(0.4); } #grabber-left::after { top: 8px; } #grabber-left.active { opacity: 1; visibility: visible; transform: translate(-50%, -16px) scale(1); }
        #grabber-right { transform: translate(-50%, 34px) scale(0.4); } #grabber-right::after { bottom: 8px; } #grabber-right.active { opacity: 1; visibility: visible; transform: translate(-50%, 34px) scale(1); }
        
        #tooltip { position: absolute; display: flex; align-items: center; gap: 7px; background: var(--charcoal); color: var(--cream); padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(184, 147, 90, 0.35); font-family: 'Hind Siliguri', sans-serif; font-size: 13px; font-weight: 700; z-index: 1020; cursor: pointer; opacity: 0; visibility: hidden; transform: translate(-50%, -100%) translateY(6px) scale(0.9); transition: opacity .16s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
        #tooltip.active { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -100%) translateY(0) scale(1); }
        #tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: var(--charcoal) transparent transparent transparent; }
        
        #toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 14px); display: flex; align-items: center; gap: 10px; background: var(--charcoal); color: var(--cream); padding: 13px 22px; border-radius: 999px; border: 1px solid rgba(184, 147, 90, 0.3); font-family: 'Hind Siliguri', sans-serif; font-size: 14.5px; opacity: 0; pointer-events: none; z-index: 6000; transition: opacity .22s ease, transform .28s cubic-bezier(.34,1.56,.64,1); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        
        body.print-mode #highlight, body.print-mode .grabber, body.print-mode #tooltip, body.print-mode #toast { display: none !important; }

        @media print {
            @page { size: A4; margin: 0; }
            .top-nav-container, .result-fab, .loading-screen, #highlight, .grabber, #tooltip, #toast, #dashboard-view { display: none !important; }
            body { background: none !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .page { box-shadow: none !important; margin: 0 !important; padding: var(--print-margin-top) var(--print-margin-right) var(--print-margin-bottom) var(--print-margin-left) !important; width: 210mm !important; height: 297mm !important; box-sizing: border-box !important; border-radius: 0 !important; page-break-after: always; position: relative !important; }
            .grand-header { display: block !important; }
            .header { display: none !important; }
            
            /* MCQ Specific Print */
            #test-view .q-card { border: none !important; margin-bottom: 0 !important; pointer-events: none !important; opacity: 1 !important; }

            #test-view .option-btn { background: transparent !important; border: 1px solid transparent !important; color: #000 !important; font-weight: normal !important; line-height: 1.1 !important; }
            
            /* Onuched Specific Print */

            #onuched-view .content-area::after { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 0.5px); border-left: 1px solid #000000 !important; pointer-events: none; z-index: 10; }
            #onuched-view .page-1 .content-area { height: 265mm !important; }
            #onuched-view .page-n .content-area { height: 288mm !important; }

                <div id="blur-toggle-btn" class="nav-icon-btn gold-tone" onclick="toggleTestBlur()" title="অপশন ব্লার"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3"/></svg></div>

                <button id="test-desktop-btn" class="view-btn" onclick="toggleView('test', 'desktop')" title="Desktop View"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg></button>

    <div id="onuched-view">

                <div class="shimmer" style="height: 15px; width: 100%;"></div><div class="shimmer" style="height: 15px; width: 90%;"></div><div class="shimmer" style="height: 15px; width: 80%;"></div>

    <!-- MAIN SCRIPT (Dashboard + Test + Onuched) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcS1zWFslmbRFS5PAvNrH8TFYIbR8N7ic",
            authDomain: "questionz-me.firebaseapp.com",
            projectId: "questionz-me",
            storageBucket: "questionz-me.firebasestorage.app",
            messagingSenderId: "393630463399",
            appId: "1:393630463399:web:825468121216445828f282",
            databaseURL: "https://questionz-me-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Progress Helper using LocalStorage
        const getLocalProgress = (key) => JSON.parse(localStorage.getItem(`qz_prog_${key}`)) || { percent: 0, locked: [] };
        const saveLocalProgress = (key, data) => localStorage.setItem(`qz_prog_${key}`, JSON.stringify(data));

        // Shared Variables
        let currentParentID, currentCatID, currentSetID, displaySetName, displayCatName, pathTextGlobal;
        let activeModule = null; // 'test' or 'onuched'
        const toBengaliNumber = (n) => n.toString().split('').map(d => ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'][d] || d).join('');

        // =====================================
        // DASHBOARD LOGIC
        // =====================================
        let historyStack = JSON.parse(sessionStorage.getItem('qz_history')) || ["root"];
        let breadcrumbs = JSON.parse(sessionStorage.getItem('qz_breadcrumbs')) || [];
        let unsubscribe = null;
        
        const categoryCache = new Map();
        const metadataCache = new Map();
        const grid = document.getElementById('category-grid');
        const loading = document.getElementById('loading');
        const breadcrumbContainer = document.getElementById('breadcrumb-container');
        
        renderBreadcrumbs();
        updateUI(historyStack[historyStack.length - 1]);

        async function loadSetsFromMetadata(s, c) {
            const k = `${s}_${c}`;
            if (metadataCache.has(k)) { renderSets(metadataCache.get(k), s, c); return; }
            try {
                const m = await getDoc(doc(db, s, c, 'sets', '_metadata'));
                if (m.exists()) { const d = m.data(); metadataCache.set(k, d); await renderSets(d, s, c); }
            } catch (e) { console.error("Metadata Load Error:", e); }
        }

        async function renderSets(d, s, c) {
            if (c !== historyStack[historyStack.length - 1]) return;
            const keys = Object.keys(d).sort();
            const fragment = document.createDocumentFragment();
            
            keys.forEach(k => {
                if (document.getElementById(`set-${k}`)) return;
                const info = d[k];
                const title = info.title || k;
                const display = title.length > 30 ? title.substring(0, 30) + "..." : title;
                const p = getLocalProgress(`${s}_${c}_${k}`).percent || 0;

                const box = document.createElement('div');
                box.id = `set-${k}`; box.className = 'noun-box';
                box.innerHTML = `<span>${display}</span><div class="progress-percent">${p}%</div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${Math.min(100, p)}%"></div></div>`;
                
                box.onclick = () => {
                    let pathText = ['Home', ...breadcrumbs, display].join(' > ');
                    // 🚀 Routing Logic: Check if it's an onuched test or mcq test
                    if (k.toLowerCase().endsWith('_onu')) {
                        startOnuched(s, c, k, pathText, display);
                    } else {
                        startTest(s, c, k, pathText, display);
                    }
                };
                fragment.appendChild(box);
            });
            
            if (c === historyStack[historyStack.length - 1]) { grid.appendChild(fragment); loading.style.display = "none"; }
        }

        function renderItems(items, pId) {
            if (pId !== historyStack[historyStack.length - 1]) return;
            const f = document.createDocumentFragment();
            items.forEach(cat => {
                if (!document.getElementById(`cat-${cat.id}`)) {
                    const display = cat.name.length > 30 ? cat.name.substring(0, 30) + "..." : cat.name;
                    const box = document.createElement('div'); box.id = `cat-${cat.id}`; box.className = 'noun-box';
                    box.innerHTML = `<span>${display}</span>`;
                    box.onclick = () => navigateTo(cat.id, cat.name);
                    f.appendChild(box);
                }
            });
            grid.appendChild(f); loading.style.display = "none";
        }

        function loadCategories(pId) {
            if (unsubscribe) unsubscribe();
            grid.innerHTML = ""; loading.style.display = "flex";
            const sId = historyStack[1];
            if (pId !== "root" && sId) loadSetsFromMetadata(sId, pId);
            
            const q = query(collection(db, "categories"), where("parentId", "==", pId));
            unsubscribe = onSnapshot(q, s => {
                const items = [];
                s.forEach(doc => { if (doc.id !== "_metadata") items.push({ id: doc.id, ...doc.data() }); });
                items.sort((a, b) => {
                    if (a.order !== undefined && b.order !== undefined) return a.order - b.order;
                    return (parseInt(a.name) || 0) - (parseInt(b.name) || 0);
                });
                
                if (items.length > 0) { categoryCache.set(pId, items); renderItems(items, pId); } 
                else if (pId === "root") { loading.style.display = "none"; grid.innerHTML = "<p style='text-align:center;font-size:14px;color:#B9B2A0;'>কোনো ক্যাটাগরি পাওয়া যায়নি।</p>"; } 
                else { setTimeout(() => { if (grid.children.length === 0 && pId === historyStack[historyStack.length - 1]) { loading.style.display = "none"; grid.innerHTML = "<p style='text-align:center;font-size:14px;color:#B9B2A0;'>কিছুই পাওয়া যায়নি।</p>"; } }, 6000); }
            });
        }

        function saveState() { sessionStorage.setItem('qz_history', JSON.stringify(historyStack)); sessionStorage.setItem('qz_breadcrumbs', JSON.stringify(breadcrumbs)); }
        function navigateTo(id, name) { historyStack.push(id); breadcrumbs.push(name); saveState(); history.pushState({ id: id }, ""); updateUI(id); }
        window.jumpTo = function(i) { if (i === -1) { historyStack = ["root"]; breadcrumbs = []; } else { historyStack = historyStack.slice(0, i + 2); breadcrumbs = breadcrumbs.slice(0, i + 1); } saveState(); updateUI(historyStack[historyStack.length - 1]); };
        function updateUI(id) { loadCategories(id); renderBreadcrumbs(); }

        function renderBreadcrumbs() {
            while (breadcrumbContainer.children.length > 1) breadcrumbContainer.removeChild(breadcrumbContainer.lastChild);
            breadcrumbs.forEach((name, i) => {
                const s = document.createElement('div'); s.innerText = ">"; s.className = "separator"; breadcrumbContainer.appendChild(s);
                const item = document.createElement('div'); item.className = 'breadcrumb-item'; item.innerText = name; item.onclick = () => jumpTo(i); breadcrumbContainer.appendChild(item);
            });
        }

        window.addEventListener('popstate', () => {
            if(activeModule) { window.goBackToDashboard(); } 
            else if (historyStack.length > 1) { historyStack.pop(); breadcrumbs.pop(); saveState(); updateUI(historyStack[historyStack.length - 1]); }
        });
        if (!history.state) history.replaceState({ id: historyStack[historyStack.length - 1] }, "");


        // =====================================
        // GLOBAL VIEW SWITCHER & FONT CONTROL
        // =====================================
        let currentQFontSize = 15; 
        let currentOptFontSize = 13;

        window.toggleView = function(module, view) { 
            document.body.classList.remove('mobile-mode', 'desktop-mode', 'print-mode'); 
            document.getElementById(`${module}-mobile-btn`).classList.remove('active'); 
            document.getElementById(`${module}-desktop-btn`).classList.remove('active'); 
            document.getElementById(`${module}-print-btn`).classList.remove('active'); 

            document.body.classList.add(view + '-mode'); 
            document.getElementById(`${module}-${view}-btn`).classList.add('active'); 
            
            if(module === 'test' && mcqData.length > 0) setTimeout(() => paginateTest(), 10);
            if(module === 'onuched' && window.lastFinalHTML) {
                window.clearSelectionUI();
                setTimeout(() => window.applyPagination(), 100);
            }
        };

        window.increaseFontSize = function(module) { 
            currentQFontSize += 2; currentOptFontSize += 2; 
            document.documentElement.style.setProperty('--q-font-size', currentQFontSize + 'px'); 
            document.documentElement.style.setProperty('--opt-font-size', currentOptFontSize + 'px'); 
            
            if(module === 'test' && mcqData.length > 0) setTimeout(() => paginateTest(), 10);
            if(module === 'onuched' && window.lastFinalHTML) {
                window.clearSelectionUI();
                setTimeout(() => window.applyPagination(), 100);
            }
        }; 
        
        window.decreaseFontSize = function(module) { 
            if (currentQFontSize > 10) { 
                currentQFontSize -= 2; currentOptFontSize -= 2; 
                document.documentElement.style.setProperty('--q-font-size', currentQFontSize + 'px'); 
                document.documentElement.style.setProperty('--opt-font-size', currentOptFontSize + 'px'); 
                if(module === 'test' && mcqData.length > 0) setTimeout(() => paginateTest(), 10);
            } 
        };

        window.goBackToDashboard = function() {
            if (timerInterval) clearInterval(timerInterval);
            document.body.classList.remove('test-active', 'onuched-active', 'mobile-mode', 'desktop-mode', 'print-mode');
            document.title = "Questionz - Dashboard";
            activeModule = null;
            history.pushState({}, "", window.location.pathname);
            updateUI(historyStack[historyStack.length - 1]);
        };


        // =====================================
        // TEST (MCQ) LOGIC
        // =====================================
        let mcqData = []; 
        let userAnswers = {}; 
        let lockedIds = new Set(); 
        let totalQuestionsCount = 0; 
        let timerInterval = null; 
        let isShuffled = false; 

        const tempStorageKey = () => `temp_ans_${currentParentID}_${currentCatID}_${currentSetID}`; 
        const fR = (text) => text ? text.toString().replace(/([০-৯0-9])\u0307/g, '<span class="recurring">$1<span class="dot">.</span></span>') : "";

        window.startTest = async function(parent, cat, set, pathText, setName) {
            activeModule = 'test';
            currentParentID = parent; currentCatID = cat; currentSetID = set;
            displaySetName = setName; pathTextGlobal = pathText; displayCatName = breadcrumbs.length > 0 ? breadcrumbs[breadcrumbs.length - 1] : cat;

            document.body.classList.add('test-active', 'mobile-mode');
            document.getElementById('test-mobile-btn').classList.add('active');
            document.getElementById('test-pages-container').innerHTML = '';
            document.getElementById('test-loading-screen').style.display = 'flex';
            
            const newUrl = `${window.location.pathname}?parent=${parent}&cat=${cat}&set=${set}`;
            history.pushState({ testView: true }, "", newUrl);

            try {

        window.renderOnuched = function() {
            window.clusters = []; let globalIndex = 0; let finalHTML = "";
            const chunks = onuchedContent.split(/(<[^>]+>)/g);
            for (let t = 0; t < chunks.length; t++) {
                let chunk = chunks[t];
                if (chunk.startsWith("<") && chunk.endsWith(">")) {
                    finalHTML += chunk;
                    if (/<\/?(td|th|tr|table|tbody|thead|p|div|br|hr|li|ul|ol|h[1-6])[^>]*>/i.test(chunk)) { window.clusters.push(' '); globalIndex++; }
                    continue;
                }
                
                let mathBlocks = [];
                let safeChunk = chunk.replace(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g, (match) => { mathBlocks.push(match); return `__MATH_${mathBlocks.length - 1}__`; });
                let parts = safeChunk.split(/(__MATH_\d+__)/);
                
                for (let p of parts) {
                    let m = p.match(/__MATH_(\d+)__/);
                    if (m) {
                        finalHTML += `<span class="qz-math">${mathBlocks[parseInt(m[1])]}</span>`;
                        window.clusters.push(' '); finalHTML += `<span data-index="${globalIndex}" style="display:none;"> </span>`; globalIndex++;
                    } else if (p) {
                        let tokens = p.split(/(\s+|[।!?]+)/);
                        for (let token of tokens) {
                            if (!token) continue;
                            let isSpaceOrPunc = /^(\s+|[।!?]+)$/.test(token);
                            let tokenClusters = window.graphemeClusters(token);
                            let tokenHTML = "";
                            for (let c of tokenClusters) { window.clusters.push(c); tokenHTML += `<span data-index="${globalIndex}">${c}</span>`; globalIndex++; }
                            finalHTML += isSpaceOrPunc ? tokenHTML : `<span class="word-group" style="white-space: nowrap; display: inline-block; cursor: text;">${tokenHTML}</span>`;
                        }
                    }
                }
            }
            window.lastFinalHTML = finalHTML; window.applyPagination();
        }

        window.applyPagination = function() {
            const container = document.getElementById('onuched-pages-container'); 
            container.innerHTML = ''; 
            const isMobile = document.body.classList.contains('mobile-mode');
            
            if (isMobile) {
                const page = createOnuchedPage(1, container);

                restoreMarksAndCollectSpans(); return;
            }
            
            const tempDiv = document.createElement('div'); 
            tempDiv.innerHTML = window.lastFinalHTML;

            // 🚀 Table Splitter for Large Tables
            const tables = tempDiv.querySelectorAll('table');
            tables.forEach(table => {
                const rows = Array.from(table.querySelectorAll('tr'));
                if (rows.length > 10) { 
                    let headerRow = null; let startIndex = 0;
                    if (rows[0] && rows[0].querySelector('th')) { headerRow = rows[0]; startIndex = 1; }
                    const fragment = document.createDocumentFragment();
                    let currentNewTable = null; let currentTbody = null; let rowCount = 0;
                    for (let r = startIndex; r < rows.length; r++) {
                        if (rowCount === 0) {
                            currentNewTable = document.createElement('table');
                            Array.from(table.attributes).forEach(attr => currentNewTable.setAttribute(attr.name, attr.value));
                            currentTbody = document.createElement('tbody');
                            if (headerRow) {
                                if (r === startIndex) { currentTbody.appendChild(headerRow); } 
                                else {
                                    const clonedHeader = headerRow.cloneNode(true);
                                    clonedHeader.querySelectorAll('span[data-index]').forEach(span => span.removeAttribute('data-index'));
                                    currentTbody.appendChild(clonedHeader);
                                }
                            }
                            currentNewTable.appendChild(currentTbody); fragment.appendChild(currentNewTable);
                        }
                        currentTbody.appendChild(rows[r]); rowCount++;
                        if (rowCount >= 10) { rowCount = 0; }
                    }
                    if (table.parentNode) { table.parentNode.replaceChild(fragment, table); }
                }
            });
            
            // Sentence Splitter
            Array.from(tempDiv.childNodes).forEach(node => {
                if (node.nodeType === 3 && node.textContent.trim() !== "") {
                    const text = node.textContent;
                    const sentences = text.split(/([।!?]+\s*)/);
                    const fragment = document.createDocumentFragment();
                    sentences.forEach(s => { if (s !== "") fragment.appendChild(document.createTextNode(s)); });
                    tempDiv.insertBefore(fragment, node); tempDiv.removeChild(node);
                }
            });

            // Smart Pagination with Node Batching
            let pageNum = 1; 
            let currentPage = createOnuchedPage(pageNum, container);
            let contentArea = currentPage.querySelector('.content-area');
            const nodes = Array.from(tempDiv.childNodes);
            
            let i = 0;
            let batchCounter = 0;

            while (i < nodes.length) {
                let node = nodes[i];
                if (node.nodeType === 3 && node.textContent.trim() === "") { i++; continue; }
                
                contentArea.appendChild(node);
                batchCounter++;
                
                let isSentenceEnd = /[।!?]+/.test(node.textContent || "");
                let isBlock = node.nodeType === 1 && /^(BR|P|DIV|TABLE|H[1-6]|UL|OL|LI)$/i.test(node.nodeName);
                
                // Only check overflow after adding a reasonable chunk or at a safe breaking point
                if (isSentenceEnd || isBlock || batchCounter >= 50 || i === nodes.length - 1) {

        }

                let index = parseInt(e.target.dataset.index);

                if (existing) { window.startIndex = existing.start; window.endIndex = existing.end; window.currentMode = 'unmark'; } 
                else {

                    while (window.startIndex > 0 && !/^(\s+|[।!?]+)$/.test(window.clusters[window.startIndex - 1])) window.startIndex--;

        function updateMarkUI() {
            if (window.startIndex === -1 || window.endIndex === -1) return;
            const containerRect = document.body.getBoundingClientRect();
            const startRect = window.spanRects[window.startIndex]; const endRect = window.spanRects[window.endIndex];
            if(!startRect || !endRect) return;

            highlight.classList.add('active'); highlight.style.left = (startRect.left - containerRect.left) + 'px'; highlight.style.top = (startRect.top - containerRect.top) + 'px'; highlight.style.width = (endRect.right - startRect.left) + 'px'; highlight.style.height = startRect.height + 'px';
            tooltip.classList.add('active'); tooltip.style.left = (startRect.left - containerRect.left + (endRect.right - startRect.left) / 2) + 'px'; tooltip.style.top = (startRect.top - containerRect.top - 15) + 'px';
            document.getElementById('tooltip-label').innerText = window.currentMode === 'mark' ? 'MARK' : 'UNMARK';
        }

        function clearSelectionUI() { highlight.classList.remove('active'); tooltip.classList.remove('active'); window.startIndex = -1; window.endIndex = -1; }

        tooltip.addEventListener('click', () => {
            if (window.startIndex === -1 || window.endIndex === -1) return;
            if (window.currentMode === 'unmark') {
                for (let i = window.startIndex; i <= window.endIndex; i++) if (window.spans[i]) window.spans[i].classList.remove('marked');
                window.markedRanges = window.markedRanges.filter(r => !(r.start === window.startIndex && r.end === window.endIndex));
            } else {
                for (let i = window.startIndex; i <= window.endIndex; i++) if (window.spans[i]) window.spans[i].classList.add('marked');
                window.markedRanges.push({ start: window.startIndex, end: window.endIndex });
            }
            updateBlankNumbers(); localStorage.setItem(`qz_saved_ranges_${currentParentID}_${currentCatID}_${currentSetID}`, JSON.stringify(window.markedRanges)); clearSelectionUI();
        });

        // =====================================
        // AUTO LOAD LOGIC FOR DIRECT LINKS
        // =====================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pParent = urlParams.get('parent'); const pCat = urlParams.get('cat'); const pSet = urlParams.get('set');
            
            if (pParent && pCat && pSet) {
                setTimeout(() => {
                    if (pSet.toLowerCase().endsWith('_onu')) startOnuched(pParent, pCat, pSet, "QUESTIONZ", pSet);
                    else startTest(pParent, pCat, pSet, "QUESTIONZ", pSet);
                }, 500);
            }
        });
    </script>
</body>
</html>
